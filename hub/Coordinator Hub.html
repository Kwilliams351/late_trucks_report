</head><body>
<title>Coordinator Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: a dispatcher's desk. One search line up top, the reference library under it,
   and a departures-board Ops view. Codes (trucks, AWBs, screens) always set in mono. */
:root{
  --bg:#f2f4f3; --surface:#ffffff; --surface-2:#e8ecea; --surface-3:#dfe5e2;
  --ink:#15211f; --muted:#56655f; --faint:#7d8b86; --line:#d3dbd7; --line-2:#c2ccc8;
  --accent:#0b6e69; --accent-ink:#ffffff; --accent-soft:rgba(11,110,105,.10); --accent-line:rgba(11,110,105,.35);
  --good:#2b7a39; --good-soft:rgba(43,122,57,.12);
  --warn:#9a6200; --warn-soft:rgba(196,132,0,.15);
  --bad:#b3332b; --bad-soft:rgba(179,51,43,.11);
  --info:#2d5da8; --info-soft:rgba(45,93,168,.11);
  --mark:rgba(230,176,30,.38);
  --shadow:0 1px 2px rgba(18,33,30,.06),0 8px 24px rgba(18,33,30,.08);
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-disp:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1412; --surface:#141d1b; --surface-2:#1a2523; --surface-3:#22302d;
  --ink:#e3ebe8; --muted:#9aaaa5; --faint:#76857f; --line:#26332f; --line-2:#33423e;
  --accent:#3cc0b6; --accent-ink:#04211f; --accent-soft:rgba(60,192,182,.13); --accent-line:rgba(60,192,182,.4);
  --good:#62c472; --good-soft:rgba(98,196,114,.14); --warn:#e3aa3d; --warn-soft:rgba(227,170,61,.15);
  --bad:#f0695d; --bad-soft:rgba(240,105,93,.14); --info:#82a9ef; --info-soft:rgba(130,169,239,.14);
  --mark:rgba(227,170,61,.35); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1412; --surface:#141d1b; --surface-2:#1a2523; --surface-3:#22302d;
  --ink:#e3ebe8; --muted:#9aaaa5; --faint:#76857f; --line:#26332f; --line-2:#33423e;
  --accent:#3cc0b6; --accent-ink:#04211f; --accent-soft:rgba(60,192,182,.13); --accent-line:rgba(60,192,182,.4);
  --good:#62c472; --good-soft:rgba(98,196,114,.14); --warn:#e3aa3d; --warn-soft:rgba(227,170,61,.15);
  --bad:#f0695d; --bad-soft:rgba(240,105,93,.14); --info:#82a9ef; --info-soft:rgba(130,169,239,.14);
  --mark:rgba(227,170,61,.35); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono);font-feature-settings:"zero" 1}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;line-height:1.2;margin:0}
.eyebrow{font:600 11.5px/1 var(--f-disp);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
[hidden]{display:none!important}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:56px;flex-wrap:wrap;padding-block:6px}
.brand{display:flex;align-items:baseline;gap:10px;color:var(--ink);margin-right:auto}
.brand b{font:700 19px/1 var(--f-disp);letter-spacing:.01em}
.brand span{font-size:12.5px;color:var(--muted)}
.brand:hover{text-decoration:none}
.nav{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:9px}
.nav a{padding:6px 12px;border-radius:7px;color:var(--muted);font:600 13.5px/1.2 var(--f-disp);letter-spacing:.02em}
.nav a:hover{text-decoration:none;color:var(--ink)}
.nav a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.clock{display:flex;align-items:center;gap:8px;font:500 13px/1 var(--f-mono);color:var(--muted)}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 var(--good-soft);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(43,160,80,.45)}70%{box-shadow:0 0 0 7px rgba(43,160,80,0)}100%{box-shadow:0 0 0 0 rgba(43,160,80,0)}}
@media (prefers-reduced-motion:reduce){.live-dot{animation:none}*{transition:none!important;animation:none!important}}
@media (max-width:640px){.brand span{display:none}.clock .tz{display:none}}

main{padding-block:24px 64px}

/* search */
.searchbar{display:flex;flex-direction:column;gap:10px}
.sbox{position:relative;display:flex;align-items:center;background:var(--surface);border:1.5px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);transition:border-color .15s}
.sbox:focus-within{border-color:var(--accent)}
.sbox svg{position:absolute;left:16px;color:var(--faint);pointer-events:none}
.sbox input{flex:1;min-width:0;border:0;background:transparent;font:500 19px/1.3 var(--f-body);color:var(--ink);padding:16px 14px 16px 50px;outline:0}
.sbox input::-webkit-search-cancel-button{display:none;-webkit-appearance:none}
.sbox input::placeholder{color:var(--faint);font-weight:400}
.sbox kbd{margin-right:14px;font:500 12px/1 var(--f-mono);color:var(--faint);border:1px solid var(--line-2);border-radius:5px;padding:4px 7px}
.sbox .clear{margin-right:10px;border:0;background:var(--surface-2);border-radius:6px;padding:5px 9px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .n{font-family:var(--f-mono);font-size:11.5px;opacity:.7;margin-left:4px}
.hint{font-size:13px;color:var(--muted)}

.home{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;margin-top:28px}
@media (max-width:920px){.home{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 10px}
.panel-h h2{font-size:16px;font-weight:600}
.panel-b{padding:0 16px 16px}

.browse{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.btile{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer;text-align:left}
.btile:hover{border-color:var(--accent);text-decoration:none}
.btile b{font:600 15px/1.2 var(--f-disp)}
.btile span{font-size:12.5px;color:var(--muted);line-height:1.35}
.btile .n{font:500 12px/1 var(--f-mono);color:var(--faint)}

.glance{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.glance a{background:var(--surface);padding:12px 14px;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.glance a:hover{text-decoration:none;background:var(--surface-2)}
.glance .v{font:600 26px/1.1 var(--f-disp);font-variant-numeric:tabular-nums}
.glance .l{font-size:12.5px;color:var(--muted)}
.glance .bad .v{color:var(--bad)} .glance .warn .v{color:var(--warn)}
.recent{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.recent li a{display:flex;gap:8px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);color:var(--ink);font-size:14px}
.recent li:first-child a{border-top:0}

/* results */
.results{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rlist li{border-top:1px solid var(--line)}
.rlist li:first-child{border-top:0}
.ritem{display:grid;grid-template-columns:120px minmax(0,1fr);gap:4px 16px;padding:13px 16px;color:var(--ink);cursor:pointer}
.ritem:hover,.ritem.sel{background:var(--accent-soft);text-decoration:none}
.ritem .kind{grid-row:span 2;padding-top:2px}
.ritem .t{font-weight:600;font-size:15.5px;line-height:1.35}
.ritem .sn{font-size:13.5px;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ritem .meta{font-size:12px;color:var(--faint);margin-top:2px}
@media (max-width:560px){.ritem{grid-template-columns:minmax(0,1fr)}.ritem .kind{grid-row:auto}}
.kchip{display:inline-flex;align-items:center;gap:6px;font:600 11.5px/1 var(--f-disp);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kchip::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--kc,var(--faint))}
.k-faq{--kc:var(--accent)} .k-screen{--kc:var(--info)} .k-note{--kc:#b07b1b} .k-team{--kc:#b07b1b} .k-ww{--kc:#7a5ab8}
.k-step{--kc:var(--good)} .k-check{--kc:var(--good)} .k-term{--kc:var(--faint)} .k-doc{--kc:var(--ink)} .k-ctrl{--kc:var(--bad)}
.k-plan{--kc:#3f7f9c} .k-report{--kc:#4b77c9} .k-duty{--kc:#8c6d3f} .k-opp{--kc:#c06a2b} .k-q{--kc:var(--warn)} .k-ref{--kc:#6b7f78}

.answer{background:var(--surface);border:1px solid var(--accent-line);border-left:4px solid var(--accent);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.answer h3{font-size:17px}
.answer .big{font:600 22px/1.2 var(--f-disp)}
.empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty h3{font-size:18px}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 13px;font-weight:500;font-size:14px;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--accent);text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.small{padding:4px 9px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.ai{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14.5px}
.ai .lab{display:flex;gap:8px;align-items:center;font:600 12px/1 var(--f-disp);letter-spacing:.06em;text-transform:uppercase;color:var(--info);margin-bottom:8px}
.ai p{margin:0 0 8px}
.ai .warnline{font-size:12.5px;color:var(--muted);margin-top:6px}

/* article */
.crumbs{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.crumbs a{color:var(--muted)}
.article{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px}
@media (max-width:920px){.article{grid-template-columns:minmax(0,1fr)}}
.art-head{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.art-head h1{font-size:clamp(26px,3.4vw,34px);font-weight:600;letter-spacing:-.005em}
.lead{font-size:17px;color:var(--muted);max-width:68ch;margin:0}
.metarow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px;color:var(--muted)}
.conf{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.conf.c-good{background:var(--good-soft);color:var(--good)} .conf.c-warn{background:var(--warn-soft);color:var(--warn)} .conf.c-info{background:var(--info-soft);color:var(--info)}
.body{max-width:72ch;display:flex;flex-direction:column;gap:14px}
.body p{margin:0}
.body h3{font-size:17px;margin-top:8px}
.body ul,.body ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.body blockquote{margin:0;padding:12px 16px;border-left:3px solid #b07b1b;background:var(--surface-2);border-radius:0 8px 8px 0;font:italic 15px/1.5 var(--f-body)}
.body blockquote::before{content:"As written · ";font:600 11px/1 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;font-style:normal;color:var(--muted)}
.callout{padding:11px 14px;border-radius:8px;background:var(--accent-soft);border:1px solid var(--accent-line);font-size:14.5px}
dl.kv{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
dl.kv dt,dl.kv dd{margin:0;padding:10px 14px;border-top:1px solid var(--line)}
dl.kv dt{font:600 13px/1.4 var(--f-disp);letter-spacing:.02em;color:var(--muted);background:var(--surface-2)}
dl.kv dt:first-of-type,dl.kv dd:first-of-type{border-top:0}
@media (max-width:560px){dl.kv{grid-template-columns:minmax(0,1fr)}dl.kv dd{border-top:0}}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;font-size:13.5px}
.tbl th{font:600 12px/1.3 var(--f-disp);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:left;background:var(--surface-2);padding:9px 12px;white-space:nowrap}
.tbl td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
.checks{list-style:none;padding:0!important;gap:2px!important}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-radius:7px;cursor:pointer}
.checks label:hover{background:var(--surface-2)}
.checks input{margin-top:4px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.checks input:checked+span{color:var(--faint);text-decoration:line-through}
.rail{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card h4{margin:0;font:600 12px/1 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.linklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.linklist li{border-top:1px solid var(--line);padding:8px 0}
.linklist li:first-child{border-top:0;padding-top:2px}
.linklist a{display:flex;flex-direction:column;gap:2px;font-size:14px;line-height:1.35}
.linklist .sub{font-size:12px;color:var(--faint)}
.ext::after{content:" ↗";font-size:12px}
.notes-list{display:flex;flex-direction:column;gap:8px}
.tnote{border:1px solid var(--line);border-left:3px solid #b07b1b;border-radius:0 8px 8px 0;padding:9px 12px;background:var(--surface);font-size:14px}
.tnote .by{font-size:12px;color:var(--faint);display:flex;gap:8px;align-items:center;margin-top:4px;flex-wrap:wrap}
.code{font-family:var(--f-mono);font-size:.92em;background:var(--surface-2);padding:1px 5px;border-radius:4px}
a.code{color:var(--info)}

/* library */
.lib{display:grid;grid-template-columns:minmax(0,1fr);gap:26px}
.docgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.dcard{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.dcard:hover{border-color:var(--accent);text-decoration:none}
.dcard b{font:600 16px/1.25 var(--f-disp)}
.dcard span{font-size:13px;color:var(--muted);line-height:1.4}
.dcard .foot{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);margin-top:auto;padding-top:4px}
details.group{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
details.group summary{cursor:pointer;padding:12px 16px;display:flex;gap:10px;align-items:center;font:600 15px/1.2 var(--f-disp);list-style:none}
details.group summary::-webkit-details-marker{display:none}
details.group summary::after{content:"+";margin-left:auto;color:var(--faint);font-family:var(--f-mono)}
details.group[open] summary::after{content:"–"}
details.group ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
details.group li a{display:block;padding:8px 16px;border-top:1px solid var(--line);color:var(--ink);font-size:14px}
details.group li:first-child a{border-top:0}
details.group li a:hover{background:var(--accent-soft);text-decoration:none}

/* ops */
.ops-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:14px}
.ops-head h1{font-size:30px;font-weight:600}
.proto{display:inline-flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);background:var(--surface);border:1px dashed var(--line-2);border-radius:8px;padding:6px 10px;max-width:640px;line-height:1.4}
.seg{display:inline-flex;background:var(--surface-2);padding:3px;border-radius:8px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:6px;cursor:pointer;font:600 13px/1.2 var(--f-mono);color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:16px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px;display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden;min-width:0}
.kpi .l{font:600 11.5px/1.2 var(--f-disp);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font:600 28px/1.05 var(--f-disp);font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.bad{box-shadow:inset 3px 0 0 var(--bad)} .kpi.bad .v{color:var(--bad)}
.kpi.warn{box-shadow:inset 3px 0 0 var(--warn)} .kpi.warn .v{color:var(--warn)}

["p","Only with prior AA Trucking approval (same rule as DG and firearms). The turnover keeps separate 'Trucks Cleared for Tobacco' and 'for Liquor' sections."],["h","Evidence"],["ul",["Trucking Turnover 10OCT – Tobacco / Liquor sections"]]],"src":"d-sharepoint","tags":["a","approvals","commodities","restricted","restricted commodities & approvals"],"conf":"Documented","links":[{"l":"Source","r":"d-src-to"}],"d":"Verified 11 Oct 2026"},{"id":"faq-A4","k":"faq","t":"Can shipments containing wood items be trucked?","s":"In one Mexico-bound case the team told the station the freight could not be trucked because the invoice showed wood items, and asked whether it would return to origin or continue…","b":[["p","In one Mexico-bound case the team told the station the freight could not be trucked because the invoice showed wood items, and asked whether it would return to origin or continue via interline. No written rule for wood was found in the sources reviewed."],["callout","Follow-up: Confirm whether this is a Mexico-import (wood packaging) restriction or a general trucking rule, and add it to the SharePoint page."],["h","Evidence"],["ul",["RE: [EXTERNAL] RE: REQUESTING PAPERWORK AWB 001 31350443 to MEX (9 Oct 2026)"]]],"src":"d-pulse","tags":["a","approvals","commodities","restricted","restricted commodities & approvals"],"conf":"Inferred","links":[],"d":"Verified 11 Oct 2026"},{"id":"faq-A5","k":"faq","t":"Can perishables ride on a non-refrigerated US truck?","s":"Not without prior approval from AA Trucking or COC.","b":[["p","Not without prior approval from AA Trucking or COC. Approved perishable moves are listed in the turnover under 'Trucks Cleared for Perishables'."],["h","Evidence"],["ul",["Fwd: TRK 8846/09OCT SXB-CDG Perishable (9 Oct 2026)"]]],"src":"d-sharepoint","tags":["a","approvals","commodities","restricted","restricted commodities & approvals"],"conf":"Documented","links":[{"l":"Source","r":"d-src-to"}],"d":"Verified 11 Oct 2026"},{"id":"faq-A6","k":"faq","t":"Which trucks are refrigerated, and how are reefer requests handled?","s":"Truck numbers 8870–8917 are LTL refrigerated (SharePoint).","b":[["p","Truck numbers 8870–8917 are LTL refrigerated (SharePoint). For reefer requests the team confirms which reefer truck the AWB is booked on and whether it needs rebooking (for example between truck numbers on different dates)."],["h","Evidence"],["ul",["RE: [EXTERNAL] RE: 001-19502206 Reefer Request YYZ-JFK (9 Oct 2026)"]]],"src":"d-sharepoint","tags":["a","approvals","commodities","restricted","restricted commodities & approvals"],"conf":"Documented","links":[],"d":"Verified 11 Oct 2026"},{"id":"faq-A7","k":"faq","t":"What does 'DGs, PMCs and Tableau Excels are not authorized to be used' mean?","s":"This is the exact wording from the October 2026 team meeting.","b":[["p","This is the exact wording from the October 2026 team meeting. Its meaning is unclear: other sources describe the team using the Tableau report to verify wait time, and PMCs/DG moving on approved trucks."],["callout","Follow-up: Ask leadership what is not authorized (specific spreadsheets? self-made trackers?) and update the team standard text."],["h","Evidence"],["ul",["Wall Walk notes – detention verified with GPS, CCTV and the Tableau report"]]],"src":"d-src-mtg","tags":["a","approvals","commodities","restricted","restricted commodities & approvals"],"conf":"Conflicting","links":[{"l":"Source","r":"d-wallwalk"}],"d":"Verified 11 Oct 2026"},{"id":"faq-B1","k":"faq","t":"What is the maximum weight/positions on a trailer?","s":"SharePoint: US trailers hold up to 5 positions (an LD3 is half a position) and 39,000 lb; international trailers up to 4 positions and 35,000 lb.","b":[["p","SharePoint: US trailers hold up to 5 positions (an LD3 is half a position) and 39,000 lb; international trailers up to 4 positions and 35,000 lb. A March 2026 manager email says a truck can hold up to 40,000 lb and usually 'volumes out' before reaching max weight."],["callout","Follow-up: Confirm the weight cap to use for planning (39,000 vs 40,000 lb). The dashboard uses 39,000 lb only for the separate 'truck fill' metric."],["h","Evidence"],["ul",["Manager A, 'FEB Trucking' (6 Mar 2026)"]]],"src":"d-sharepoint","tags":["b","capacity","dims","equipment","equipment, capacity & dims"],"conf":"Conflicting","links":[],"d":"Verified 11 Oct 2026"},{"id":"faq-B2","k":"faq","t":"When do we order a rollerbed truck?","s":"Only when a PMC (LD7/LD9) is actually booked.","b":[["p","Only when a PMC (LD7/LD9) is actually booked. DFW, LAX, MIA, ORD and PHX require a rollerbed whenever a PMC is booked. PMC bookings are reviewed daily for day 0, +1 and +2 and rollerbeds are requested only for the impacted days."],["h","Evidence"],["ul",["Trucking Turnover 10OCT – 'Trucks Cleared for PMCs (for DFW, LAX, MIA, ORD & PHX)'"]]],"src":"d-src-roll","tags":["b","capacity","dims","equipment","equipment, capacity & dims"],"conf":"Inferred","links":[{"l":"Source","r":"d-src-to"}],"d":"Verified 11 Oct 2026"},{"id":"faq-B3","k":"faq","t":"What is the rollerbed fee for ACC?","s":"$200 (October 2026 meeting).","b":[["p","$200 (October 2026 meeting). 'ACC' appears to mean the vendor Accelerated: Accelerated requested a $200 surcharge per rollerbed truck (Aug 2026) and turnover lines say 'requested to ACC'. ACC is also the airport code for Accra."],["callout","Follow-up: Confirm ACC = Accelerated Courier and whether the $200 is per truck or per PMC."],["h","Evidence"],["ul",["Trucking Turnover 10OCT – '7993/10OCT DFW-MIA … requested to ACC'"]]],"src":"d-src-mtg","tags":["b","capacity","dims","equipment","equipment, capacity & dims"],"conf":"Documented","links":[{"l":"Source","r":"d-src-roll"}],"d":"Verified 11 Oct 2026"},{"id":"faq-B4","k":"faq","t":"Will the shipment fit a sprinter van or a specific vehicle?","s":"Ask the vendor for the vehicle's max weight and whether the dims fit (pieces, dims, weight, stackable).","b":[["p","Ask the vendor for the vehicle's max weight and whether the dims fit (pieces, dims, weight, stackable). The team followed up on unanswered capacity questions."],["h","Evidence"],["ul",["Re: [EXTERNAL] Re: LAX/PHX/DFW - YVR (Oct 2026)"]]],"src":"d-pulse","tags":["b","capacity","dims","equipment","equipment, capacity & dims"],"conf":"Inferred","links":[],"d":"Verified 11 Oct 2026"},{"id":"faq-B5","k":"faq","t":"Can a PMC go on a dry-bed trailer?","s":"No evidence it is accepted: a PMC loaded on a dry-bed trailer was refused at ORD and a trailer swap was paid.","b":[["p","No evidence it is accepted: a PMC loaded on a dry-bed trailer was refused at ORD and a trailer swap was paid. Match PMCs to rollerbed equipment."],["h","Evidence"],["ul",["Surface Logistics Coordinator Hub v2 – Mailbox Gaps G03 (Jan 2026 case)"]]],"src":"d-pulse","tags":["b","capacity","dims","equipment","equipment, capacity & dims"],"conf":"Inferred","links":[],"d":"Verified 11 Oct 2026"},{"id":"faq-B6","k":"faq","t":"What do I do when dims look wrong (1x1x1 or 'outrageous volume')?","s":"Contact the origin for actual dims and the handling station for photos, correct the AWB, then make sure the right number of trucks is assigned.","b":[["p","Contact the origin for actual dims and the handling station for photos, correct the AWB, then make sure the right number of trucks is assigned. Wrong dims hold space on flights and trucks."],["callout","Follow-up: No automated alert exists yet; RM was asked to extend the extreme-dims report to trucking."],["h","Evidence"],["ul",["FW: awb 001-32259883 outrageous volume (6 Oct 2026)"]]],"src":"d-pulse","tags":["b","capacity","dims","equipment","equipment, capacity & dims"],"conf":"Inferred","links":[],"d":"Verified 11 Oct 2026"},{"id":"faq-B7","k":"faq","t":"A handler says volume weight was under-declared. Do we update the TLM?","s":"Yes: correct the AWB volume with origin and have the TLMs adjusted.","b":[["p","Yes: correct the AWB volume with origin and have the TLMs adjusted. The contract template says the TLM is the basis for payment; an incorrect TLM is voided and reissued."],["h","Evidence"],["ul",["RE: [EXTERNAL] FW: FRANKLIN CONSOL 001-32975843 - under declared vol weight (9 Oct 2026)"]]],"src":"d-src-ct","tags":["b","capacity","dims","equipment","equipment, capacity & dims"],"conf":"Documented","links":[],"d":"Verified 11 Oct 2026"},{"id":"faq-B8","k":"faq","t":"How many skids fit on a full truck?","s":"One lane example: 30 skids per truck (LAX–PHX).","b":[["p","One lane example: 30 skids per truck (LAX–PHX). Treat as lane-specific; confirm with the vendor."],["h","Evidence"],["ul",["RE: AGS LAX-PHX-HNL (Oct 2025)"]]],"src":"d-pulse","tags":["b","capacity","dims","equipment","equipment, capacity & dims"],"conf":"Inferred","links":[],"d":"Verified 11 Oct 2026"},{"id":"faq-C1","k":"faq","t":"A booking fails minimum connection time. What do we do?","s":"The team tries a forcebook or moves the AWB to the next truck and confirms back.","b":[["p","The team tries a forcebook or moves the AWB to the next truck and confirms back. In the October example the forcebook desk updated the flight but could not forcebook the AWB; the outcome is not in the sources."],["callout","Follow-up: Document who owns forcebook failures and the fallback path."],["h","Evidence"],["ul",["Re: [EXTERNAL] Booking Issue - minimum connection time [778459] (9 Oct 2026)"]]],"src":"d-pulse","tags":["booking","booking, routing & quotes","c","quotes","routing"],"conf":"Unresolved","links":[],"d":"Verified 11 Oct 2026"},{"id":"faq-C2","k":"faq","t":"A partner asks to add an AWB to the exception list for an embargo. Can we?","s":"Requests arrive from GSAs (for example for a Sunday EWR embargo).","b":[["p","Requests arrive from GSAs (for example for a Sunday EWR embargo). No written rule on who approves exceptions was found; embargoes are configured by the iCargo rules/embargo owners listed in the COC Handbook."],["callout","Follow-up: Confirm the approver for embargo exceptions on truck legs."],["h","Evidence"],["ul",["[EXTERNAL] AWB 001-25111004 (9 Oct 2026)"]]],"src":"d-src-hb","tags":["booking","booking, routing & quotes","c","quotes","routing"],"conf":"Unresolved","links":[],"d":"Verified 11 Oct 2026"},{"id":"faq-C3","k":"faq","t":"Freight missed its truck. What do we ask the station?","s":"Ask the station to rebook the AWB on the next available truck and to explain why it did not depart; follow up if there is no answer.","b":[["p","Ask the station to rebook the AWB on the next available truck and to explain why it did not depart; follow up if there is no answer."],["h","Evidence"],["ul",["RE MAWB 001-29862991 Aging (Oct 2026)","TRK8610MCI (9 Oct 2026)"]]],"src":"d-pulse","tags":["booking","booking, routing & quotes","c","quotes","routing"],"conf":"Inferred","links":[],"d":"Verified 11 Oct 2026"},{"id":"faq-C4","k":"faq","t":"How does Sales request a full truck (FTL/EUV)?","s":"With the 'Full Truck Request – Airport to Airport' form on the SharePoint Trucking page.","b":[["p","With the 'Full Truck Request – Airport to Airport' form on the SharePoint Trucking page. The team checks for an existing scheduled/contracted option first; otherwise it bids to vendors. It generally asks for 24 h notice (48 h for special equipment or international)."]],"src":"d-sharepoint","tags":["booking","booking, routing & quotes","c","quotes","routing"],"conf":"Documented","links":[{"l":"Source","r":"d-wallwalk"}],"d":"Verified 11 Oct 2026"},{"id":"faq-C5","k":"faq","t":"There is no contracted rate for the lane. What next?","s":"Send a bid by blind copy to the vendor distribution lists, compare price and vendor performance (not only lowest price), and give new vendors an ad hoc move before a scheduled…","b":[["p","Send a bid by blind copy to the vendor distribution lists, compare price and vendor performance (not only lowest price), and give new vendors an ad hoc move before a scheduled truck."]],"src":"d-wallwalk","tags":["booking","booking, routing & quotes","c","quotes","routing"],"conf":"Inferred","links":[],"d":"Verified 11 Oct 2026"},{"id":"faq-C6","k":"faq","t":"Should FTL and LTL trucks on the same lane be balanced?","s":"Yes. The manager noted extra FTL cost on LAX–DFW when agents did not balance FTL and LTL; consolidate before ordering an extra FTL.","b":[["p","Yes. The manager noted extra FTL cost on LAX–DFW when agents did not balance FTL and LTL; consolidate before ordering an extra FTL."],["h","Evidence"],["ul",["Manager A, 'FEB Trucking' (6 Mar 2026)"]]],"src":"d-pulse","tags":["booking","booking, routing & quotes","c","quotes","routing"],"conf":"Inferred","links":[],"d":"Verified 11 Oct 2026"},{"id":"faq-D1","k":"faq","t":"What paperwork is needed for trucks into Mexico?","s":"Emails ask for scanned MAWB, HAWB and commercial invoice; the turnover tracks amended invoices (shipper name and address) and full Mexican consignee address.","b":[["p","Emails ask for scanned MAWB, HAWB and commercial invoice; the turnover tracks amended invoices (shipper name and address) and full Mexican consignee address. SharePoint links a 'DFW to Mexico Trucks (Booking and Ops)' document that was not available for this review."],["callout","Follow-up: Review the SharePoint 'DFW to Mexico Trucks' document and replace this answer with its checklist."],["h","Evidence"],["ul",["RE: REQUESTING PAPERWORK AWB 001 31350443 to MEX","001 3217 1031 // KULMEX / TRUCK DOCS exDFW-MEX"]]],"src":"d-sharepoint","tags":["customs","d","documents","documents & customs"],"conf":"Inferred","links":[{"l":"Source","r":"d-src-to"}],"d":"Verified 11 Oct 2026"},{"id":"faq-D2","k":"faq","t":"An EU truck needs a T1. What do we ask for?","s":"Ask the destination handler for the customs code needed to issue the T1 document, then pass it to the origin handler.","b":[["p","Ask the destination handler for the customs code needed to issue the T1 document, then pass it to the origin handler."],["h","Evidence"],["ul",["RE: TRK 7337/11OCT CDG-ZRH (9 Oct 2026)"]]],"src":"d-pulse","tags":["customs","d","documents","documents & customs"],"conf":"Inferred","links":[],"d":"Verified 11 Oct 2026"},{"id":"faq-D3","k":"faq","t":"Do original documents travel with interline freight?","s":"In the IAH→DWC/AUH interline case the station asked for all docs with the pre-alerts (including the CSD) and the originals in the pouch with the shipment.","b":[["p","In the IAH→DWC/AUH interline case the station asked for all docs with the pre-alerts (including the CSD) and the originals in the pouch with the shipment."],["h","Evidence"],["ul",["Re: Crane IAH_New Interline Business DWC/AUH (9 Oct 2026)"]]],"src":"d-pulse","tags":["customs","d","documents","documents & customs"],"conf":"Inferred","links":[],"d":"Verified 11 Oct 2026"},{"id":"faq-D4","k":"faq","t":"Should a station refuse a truck when paperwork is missing?","s":"No, per the Wall Walk: stations were told not to refuse freight; the team scans the documents to the station once received.","b":[["p","No, per the Wall Walk: stations were told not to refuse freight; the team scans the documents to the station once received."],["callout","Follow-up: Confirm this is written in station procedures."]],"src":"d-wallwalk","tags":["customs","d","documents","documents & customs"],"conf":"Inferred","links":[],"d":"Verified 11 Oct 2026"},{"id":"faq-D5","k":"faq","t":"How are customs holds on trucked AWBs tracked?","s":"In the turnover 'Pending Customs Related Issues' table (AWB, blocked station, hold type, truck, comments), with reminders to the customer or broker.","b":[["p","In the turnover 'Pending Customs Related Issues' table (AWB, blocked station, hold type, truck, comments), with reminders to the customer or broker."]],"src":"d-src-to","tags":["customs","d","documents","documents & customs"],"conf":"Inferred","links":[],"d":"Verified 11 Oct 2026"},{"id":"faq-E1","k":"faq","t":"What must a DDX prealert say?","s":"\"Please provide ATA within two hours of arrival and PODs within 24hrs.\" Do not modify the prealert without leadership approval.","b":[["p","\"Please provide ATA within two hours of arrival and PODs within 24hrs.\" Do not modify the prealert without leadership approval."],["h","Evidence"],["ul",["[EXTERNAL] RE: TRK 7293 & 7294/09OCT PHL-JFK (DDX) UPS (9 Oct 2026)"]]],"src":"d-src-mtg","tags":["(customer","/","ddx","ddx / dpu (customer pickup & delivery)","delivery)","dpu","e","pickup"],"conf":"Documented","links":[],"d":"Verified 11 Oct 2026"},{"id":"faq-E2","k":"faq","t":"Who can work an ad hoc DDX or DPU?","s":"Anyone on the team, not only the usual owner.","b":[["p","Anyone on the team, not only the usual owner."]],"src":"d-src-mtg","tags":["(customer","/","ddx","ddx / dpu (customer pickup & delivery)","delivery)","dpu","e","pickup"],"conf":"Documented","links":[],"d":"Verified 11 Oct 2026"},{"id":"faq-E3","k":"faq","t":"Is a TSA form required for direct pickups?","s":"Every US direct pickup needs a TSA form confirming an AA representative saw the freight when accepted from the driver; the form is linked on SharePoint ('Customer Pick-up TSA…","b":[["p","Every US direct pickup needs a TSA form confirming an AA representative saw the freight when accepted from the driver; the form is linked on SharePoint ('Customer Pick-up TSA Security Form'). The driver's name is needed at pickup and delivery."]],"src":"d-sharepoint","tags":["(customer","/","ddx","ddx / dpu (customer pickup & delivery)","delivery)","dpu","e","pickup"],"conf":"Documented","links":[{"l":"Source","r":"d-wallwalk"}],"d":"Verified 11 Oct 2026"},{"id":"faq-E4","k":"faq","t":"Which AWB date range do we arrive for offline stations or DDX?","s":"The meeting rule is to arrive the correct AWB date range.","b":[["p","The meeting rule is to arrive the correct AWB date range. The exact range is not defined in the sources."],["callout","Follow-up: Define the correct date range in the training doc."]],"src":"d-src-mtg","tags":["(customer","/","ddx","ddx / dpu (customer pickup & delivery)","delivery)","dpu","e","pickup"],"conf":"Documented","links":[],"d":"Verified 11 Oct 2026"},{"id":"faq-E5","k":"faq","t":"How are DDX trucks identified?","s":"By truck-number ranges used for reporting: 7030–7076, 7231–7250, 7320–7325, 7500–7520, 7331–7335, 7341–7344, 7531–7550.","b":[["p","By truck-number ranges used for reporting: 7030–7076, 7231–7250, 7320–7325, 7500–7520, 7331–7335, 7341–7344, 7531–7550. There is no system flag in iCargo yet (Wall Walk)."],["callout","Follow-up: Ranges are recycled; confirm before relying on them."]],"src":"d-src-ddxr","tags":["(customer","/","ddx","ddx / dpu (customer pickup & delivery)","delivery)","dpu","e","pickup"],"conf":"Inferred","links":[{"l":"Source","r":"d-wallwalk"}],"d":"Verified 11 Oct 2026"},{"id":"faq-E6","k":"faq","t":"How fast must AWBs be delivered after a truck arrives?","s":"Wall Walk notes say two hours after truck arrival (tied to the NFD milestone).","b":[["p","Wall Walk notes say two hours after truck arrival (tied to the NFD milestone). A Cargo acronyms document lists NFD as 2 h domestic / 4 h international flights."],["callout","Follow-up: Confirm the NFD window for trucked freight."],["h","Evidence"],["ul",["Cargo Acronyms and Terms.docx (shared Mar 2026)"]]],"src":"d-wallwalk","tags":["(customer","/","ddx","ddx / dpu (customer pickup & delivery)","delivery)","dpu","e","pickup"],"conf":"Conflicting","links":[],"d":"Verified 11 Oct 2026"},{"id":"faq-F1","k":"faq","t":"A vendor asks whether a truck will operate tomorrow. What do we send?","s":"Confirm run or cancel and send the details (AWBs, pieces/weight, pickup and delivery).","b":[["p","Confirm run or cancel and send the details (AWBs, pieces/weight, pickup and delivery). Weekend schedule questions are time-critical."],["h","Evidence"],["ul",["[EXTERNAL] Weekend Schedule- 10/10 to 10/12/26","[EXTERNAL] Truck 7073 MUC-STR Sunday 11 OCT"]]],"src":"d-pulse","tags":["cancellations","f","schedules","schedules & cancellations"],"conf":"Inferred","links":[],"d":"Verified 11 Oct 2026"},{"id":"faq-F2","k":"faq","t":"A truck has no freight. Do we cancel it?","s":"Yes; trucks with no bookings are cancelled so no new bookings can be made, and cancellations are logged in the turnover (for example 'Cancelled due to no freight').","b":[["p","Yes; trucks with no bookings are cancelled so no new bookings can be made, and cancellations are logged in the turnover (for example 'Cancelled due to no freight')."],["h","Evidence"],["ul",["RE: VIP Visit on Wednesday, October 14, 2026 (9 Oct 2026)"]]],"src":"d-src-to","tags":["cancellations","f","schedules","schedules & cancellations"],"conf":"Inferred","links":[],"d":"Verified 11 Oct 2026"},{"id":"faq-F3","k":"faq","t":"What does a last-minute customer cancellation cost?","s":"About $200 is passed through to the customer with no markup (Wall Walk).","b":[["p","About $200 is passed through to the customer with no markup (Wall Walk). Truck-not-used fees are avoided by confirming freight, booking and customs status before dispatch."]],"src":"d-wallwalk","tags":["cancellations","f","schedules","schedules & cancellations"],"conf":"Inferred","links":[],"d":"Verified 11 Oct 2026"},{"id":"faq-F4","k":"faq","t":"How do we process a schedule change?","s":"Confirm the date range with the vendor, update the internal ('ugly') schedule, the trucks-to-country tab and the published ('pretty') schedule, record it in the Thursday update…","b":[["p","Confirm the date range with the vendor, update the internal ('ugly') schedule, the trucks-to-country tab and the published ('pretty') schedule, record it in the Thursday update notes, and send the weekly distribution. Get RM approval for added/removed trucks."],["h","Evidence"],["ul",["RE: [EXTERNAL] Change of schedule (9 Oct 2026)"]]],"src":"d-src-sched","tags":["cancellations","f","schedules","schedules & cancellations"],"conf":"Documented","links":[],"d":"Verified 11 Oct 2026"},{"id":"faq-F5","k":"faq","t":"An airport closure or VIP event restricts a station. What are the steps?","s":"Find impacted trucks; ask vendors to adjust; update the iCargo schedule; cancel impacted trucks with no bookings; give the DOD the impacted AWBs so customers are contacted.","b":[["p","Find impacted trucks; ask vendors to adjust; update the iCargo schedule; cancel impacted trucks with no bookings; give the DOD the impacted AWBs so customers are contacted."],["callout","Follow-up: Turn this into a written guide (the manager said a guide would follow)."],["h","Evidence"],["ul",["Manager A, 'VIP Visit on Wednesday, October 14, 2026' (9 Oct 2026)"]]],"src":"d-pulse","tags":["cancellations","f","schedules","schedules & cancellations"],"conf":"Documented","links":[],"d":"Verified 11 Oct 2026"},{"id":"faq-G1","k":"faq","t":"A truck is running late. What do we do?","s":"Ask the vendor for the reason and a new ETA.","b":[["p","Ask the vendor for the reason and a new ETA. The contract template requires vendors to notify delays of 1 hour or more. Trucks more than 1 hour late are logged in the truck report card."],["h","Evidence"],["ul",["[EXTERNAL] RE: TRK 7886/28SEP DUB-BFS ETA"]]],"src":"d-src-ct","tags":["delays","delays, no-shows & traces","g","no-shows","traces"],"conf":"Documented","links":[{"l":"Source","r":"d-wallwalk"}],"d":"Verified 11 Oct 2026"},{"id":"faq-G2","k":"faq","t":"Which no-shows should we not work?","s":"Interline-origin AWBs, and EU-origin AWBs at offline stations without iCargo (for example WAW, STR, HAM).","b":[["p","Interline-origin AWBs, and EU-origin AWBs at offline stations without iCargo (for example WAW, STR, HAM). They show no iCargo updates until they reach origin."],["callout","Follow-up: The full offline-station list was not provided; training docs must be updated (meeting action)."]],"src":"d-src-mtg","tags":["delays","delays, no-shows & traces","g","no-shows","traces"],"conf":"Documented","links":[],"d":"Verified 11 Oct 2026"},{"id":"faq-G3","k":"faq","t":"A vendor reports a driver is sick, had a family issue or an accident.","s":"Ask if they are okay first, then confirm the recovery plan and new ETA.","b":[["p","Ask if they are okay first, then confirm the recovery plan and new ETA."]],"src":"d-src-mtg","tags":["delays","delays, no-shows & traces","g","no-shows","traces"],"conf":"Documented","links":[],"d":"Verified 11 Oct 2026"},{"id":"faq-G4","k":"faq","t":"Pieces were not received or left behind on a truck.","s":"Check the TLM/manifest, confirm with origin and destination stations, and get iCargo dispatch/receipt corrected; if left behind, rebook on the next truck.","b":[["p","Check the TLM/manifest, confirm with origin and destination stations, and get iCargo dispatch/receipt corrected; if left behind, rebook on the next truck."],["h","Evidence"],["ul",["[CONTRACTOR] MISSING AWB#001-33180136, 001-22715114","AWB 001-33906250 4pcs Left Behind for 8955"]]],"src":"d-pulse","tags":["delays","delays, no-shows & traces","g","no-shows","traces"],"conf":"Inferred","links":[],"d":"Verified 11 Oct 2026"},{"id":"faq-G5","k":"faq","t":"Why do MIA–OPF and JFK–NYC trucks exist?","s":"They are interline transfer trucks.","b":[["p","They are interline transfer trucks. iCargo does not accept MIA–MIA or JFK–JFK, so a nearby code is used; the truck physically stays at the same airport. They follow the Interline Transfer Trucking job aid."],["h","Evidence"],["ul",["Manager A, 'RE: MIAOPF Truck Question' (7 May 2026) + Interline Transfer Trucking Management Job Aid"]]],"src":"d-pulse","tags":["delays","delays, no-shows & traces","g","no-shows","traces"],"conf":"Documented","links":[],"d":"Verified 11 Oct 2026"},{"id":"faq-H1","k":"faq","t":"Do we pay wait time or detention?","s":"Not when the vendor arrives too early or too late.","b":[["p","Not when the vendor arrives too early or too late. Claims are checked against the schedule using GPS and sign-in sheets; legitimate charges are paid."],["h","Evidence"],["ul",["[EXTERNAL] RE: Detention Tags ORD1862342 & ORD1862334","[EXTERNAL] RE: Detention MCI Tag ORD1862342"]]],"src":"d-src-mtg","tags":["billing","billing, detention, rates & fuel","detention","fuel","h","rates"],"conf":"Documented","links":[{"l":"Source","r":"d-wallwalk"}],"d":"Verified 11 Oct 2026"},{"id":"faq-H2","k":"faq","t":"Who do we reply to on wait-time/detention emails?","s":"The meeting note says replies were going to stations only and that a new template was created.","b":[["p","The meeting note says replies were going to stations only and that a new template was created. Recent emails show the team replying on the vendor thread. The new template was not in the sources reviewed."],["callout","Follow-up: Share the new template and confirm the recipient (vendor, station, or both)."],["h","Evidence"],["ul",["[EXTERNAL] RE: Detention MCI Tag ORD1862342 / TO 2608100161"]]],"src":"d-src-mtg","tags":["billing","billing, detention, rates & fuel","detention","fuel","h","rates"],"conf":"Unresolved","links":[],"d":"Verified 11 Oct 2026"},{"id":"faq-H3","k":"faq","t":"How is the domestic fuel surcharge set?","s":"A monthly trigger based on the US on-highway diesel price table in the domestic contract (example: April 2026 = 39.5%).","b":[["p","A monthly trigger based on the US on-highway diesel price table in the domestic contract (example: April 2026 = 39.5%). Per the contract template, fuel adjustments need 30 days' notice. Several vendors negotiated exceptions in 2026."],["callout","Follow-up: The current month's % is not in the sources."],["h","Evidence"],["ul",["Manager A, 'Domestic Fuel Trigger' (31 Mar 2026)"]]],"src":"d-src-ct","tags":["billing","billing, detention, rates & fuel","detention","fuel","h","rates"],"conf":"Documented","links":[],"d":"Verified 11 Oct 2026"},{"id":"faq-H4","k":"faq","t":"How long does a vendor have to invoice?","s":"90 days from the AC12-ST date in the contract template; later bills may be denied.","b":[["p","90 days from the AC12-ST date in the contract template; later bills may be denied."],["callout","Follow-up: Confirm executed contracts carry the same term."]],"src":"d-src-ct","tags":["billing","billing, detention, rates & fuel","detention","fuel","h","rates"],"conf":"Documented","links":[],"d":"Verified 11 Oct 2026"},{"id":"faq-H5","k":"faq","t":"Trucking charges appeared on a handling invoice. What now?","s":"Trucking expense should be booked through RFS/SAP.","b":[["p","Trucking expense should be booked through RFS/SAP. In the CDG case Finance asked for reimbursement as a credit invoice or separate submission rather than an offset."],["h","Evidence"],["ul",["Re: CDG Trucking - Cargo (Aug–Sep 2026)"]]],"src":"d-pulse","tags":["billing","billing, detention, rates & fuel","detention","fuel","h","rates"],"conf":"Inferred","links":[],"d":"Verified 11 Oct 2026"},{"id":"faq-H6","k":"faq","t":"What do we do with system alerts such as 'overpaid' lanes?","s":"Action them; do not just click through (meeting example: LAX/MIA 9/8 overpaid).","b":[["p","Action them; do not just click through (meeting example: LAX/MIA 9/8 overpaid). The specific steps are not written down; SharePoint links an Accounting Discrepancy Log."],["callout","Follow-up: Write the alert-handling steps."]],"src":"d-src-mtg","tags":["billing","billing, detention, rates & fuel","detention","fuel","h","rates"],"conf":"Documented","links":[{"l":"Source","r":"d-sharepoint"}],"d":"Verified 11 Oct 2026"},{"id":"faq-H7","k":"faq","t":"Which iCargo trucking defects are open?","s":"From the 10 Oct turnover: empty truck orders with charges, ULDs not rating as bulk, duplicate TOs, CAP142 +1 display, CAP018 duplicate trips, AWBs reappearing on CAP141, LTE001…","b":[["p","From the 10 Oct turnover: empty truck orders with charges, ULDs not rating as bulk, duplicate TOs, CAP142 +1 display, CAP018 duplicate trips, AWBs reappearing on CAP141, LTE001 acceptance, CAP018/TRK001 piece mismatch. Several are pending a change request."]],"src":"d-src-to","tags":["billing","billing, detention, rates & fuel","detention","fuel","h","rates"],"conf":"Unresolved","links":[],"d":"Verified 11 Oct 2026"},{"id":"faq-J1","k":"faq","t":"Is moving an email to a folder enough?","s":"No. Answer the email, don't just move it (meeting example: /AA*8696 20 AUG).","b":[["p","No. Answer the email, don't just move it (meeting example: /AA*8696 20 AUG)."]],"src":"d-src-mtg","tags":["inbox","inbox & team process","j","process","team"],"conf":"Documented","links":[],"d":"Verified 11 Oct 2026"},{"id":"faq-J2","k":"faq","t":"A teammate or Boots on the Ground posts a request in Teams.","s":"Answer every request from our own team, including contractor colleagues; claim it or reply 'on it'.","b":[["p","Answer every request from our own team, including contractor colleagues; claim it or reply 'on it'. Repeated unanswered weekend requests were raised in the October meeting."]],"src":"d-src-mtg","tags":["inbox","inbox & team process","j","process","team"],"conf":"Documented","links":[],"d":"Verified 11 Oct 2026"},{"id":"faq-J3","k":"faq","t":"What goes on the turnover?","s":"All pending items for the team, not only your personal turnover (meeting example: a FedEx DDX issue was on a personal turnover but missing from the team turnover).","b":[["p","All pending items for the team, not only your personal turnover (meeting example: a FedEx DDX issue was on a personal turnover but missing from the team turnover)."]],"src":"d-src-mtg","tags":["inbox","inbox & team process","j","process","team"],"conf":"Documented","links":[{"l":"Source","r":"d-src-to"}],"d":"Verified 11 Oct 2026"},{"id":"faq-J4","k":"faq","t":"Who do I contact for iCargo rules, embargoes or 24/7 escalation?","s":"The COC Handbook lists iCargo Rules/Embargos owners, Cargo Escalations (24/7) and Cargo DOD mailboxes.","b":[["p","The COC Handbook lists iCargo Rules/Embargos owners, Cargo Escalations (24/7) and Cargo DOD mailboxes."],["callout","Follow-up: Handbook has no date; confirm the contacts are current."]],"src":"d-src-hb","tags":["inbox","inbox & team process","j","process","team"],"conf":"Documented","links":[],"d":"Verified 11 Oct 2026"},{"id":"faq-J5","k":"faq","t":"A handler asks for forecasts or pre-alerts by a deadline (e.g., CDG by 12:00).","s":"Acknowledge and involve IT when the timing comes from automated pre-alerts.","b":[["p","Acknowledge and involve IT when the timing comes from automated pre-alerts. In October, CDG asked for forecasts by 12:00 because extra trucks are booked before noon; the automated France pre-alerts were going out later and a fix was requested."],["h","Evidence"],["ul",["RE: [EXTERNAL] Previs CDG - Horaire d'envoi (9 Oct 2026)"]]],"src":"d-pulse","tags":["inbox","inbox & team process","j","process","team"],"conf":"Unresolved","links":[],"d":"Verified 11 Oct 2026"},{"id":"scr-trk001","k":"screen","t":"TRK001 / Truck Order","s":"Builds the truck order (TO) for a truck number, date and airport: add shipments, driver name and ID, lock or seal number, actual departure, remarks; Save, Print, Reopen, Approve.","b":[["kv",[["What it does","Builds the truck order (TO) for a truck number, date and airport: add shipments, driver name and ID, lock or seal number, actual departure, remarks; Save, Print, Reopen, Approve. iCargo emails the final TO to the vendor."],["Why it matters / when","The TO is what the vendor is paid against and what the station loads to. Use it to check what is really on a truck, to reconcile pieces when a station reports a discrepancy, and for MIA–OPF / JFK–NYC interline transfer trucks (job aid). An RPA bot also runs TRK001 on the shared VM."]]]],"src":"d-fieldguide","tags":["driver","icargo","interline","pieces","screen","seal","tlm","to","trk001","truck order"],"conf":"Confirmed (Interline Trucking job aid)","links":[],"d":"14 Oct 2026"},{"id":"scr-trk002","k":"screen","t":"TRK002","s":"Lists non-bookable trucks (OA transfers, GSA, COMAT, maintenance).","b":[["kv",[["What it does","Lists non-bookable trucks (OA transfers, GSA, COMAT, maintenance). The FLT screens only show bookable trucks."],["Why it matters / when","Look here when a non-bookable truck number (7000–7029, 7201–7254 GSA) appears on an AWB or trace and you cannot find it in FLT."]]]],"src":"d-fieldguide","tags":["comat","gsa","icargo","non-bookable","oa transfer","screen","trk002"],"conf":"From notes","links":[],"d":"14 Oct 2026"},{"id":"scr-flt005","k":"screen","t":"FLT005 / Scheduled truck","s":"Sets up a scheduled truck.","b":[["kv",[["What it does","Sets up a scheduled truck."],["Why it matters / when","Schedule changes, holiday or VIP-event changes (e.g. the 14 Oct VIP visit inbound trucks moved to the 15th). The schedule is loaded a quarter at a time."]]]],"src":"d-fieldguide","tags":["flt005","holiday","icargo","schedule change","scheduled truck","screen","vip"],"conf":"Confirmed (SharePoint job aid, Wall Walk)","links":[],"d":"14 Oct 2026"},{"id":"scr-flt003","k":"screen","t":"FLT003 / Ad hoc truck","s":"Sets up an ad hoc truck; your notes say it is used to 'push' / update an ad hoc truck.","b":[["kv",[["What it does","Sets up an ad hoc truck; your notes say it is used to 'push' / update an ad hoc truck."],["Why it matters / when","Every awarded ad hoc truck needs a number and set-up before the booking can be attached. Its role in trace correction is still unconfirmed."]]]],"src":"d-fieldguide","tags":["ad hoc","flt003","icargo","push","screen","set up truck"],"conf":"Confirmed (job aid); trace use unresolved","links":[],"d":"14 Oct 2026"},{"id":"scr-trc009","k":"screen","t":"TRC009 / Tracing case list","s":"Open tracing cases by TC status, date range, reported airport; Export to Excel.","b":[["kv",[["What it does","Open tracing cases by TC status, date range, reported airport; Export to Excel."],["Why it matters / when","Daily trace task: clear the prefilled DFW, choose the TC statuses, Next Alert Time −2 days (−3 if nobody worked yesterday), export, then find truck cases by Flight number."]]]],"src":"d-fieldguide","tags":["export","icargo","screen","tc","trace","tracing","trc009"],"conf":"Confirmed (screenshot, 12 Oct)","links":[],"d":"14 Oct 2026"},{"id":"scr-rpt002","k":"screen","t":"RPT002 / List dashboard","s":"The 'Overbooking Truck' report – despite the name it shows all trucks, truck and AWB level, executed / on hand / partially on hand, PMC flags.","b":[["kv",[["What it does","The 'Overbooking Truck' report – despite the name it shows all trucks, truck and AWB level, executed / on hand / partially on hand, PMC flags. Also the source of DEP performance in the Daily Sit report."],["Why it matters / when","Your best single view of tonight's trucks: underbooked, overbooked, freight not on hand, PMCs that need special equipment. Kim prefers it to the Power BI load-factor view for day-to-day work."]]]],"src":"d-fieldguide","tags":["dashboard","dep performance","icargo","overbooking","report","rpt002","screen"],"conf":"Confirmed (Kim, 30 Apr; Daily Sit definitions)","links":[],"d":"14 Oct 2026"},{"id":"scr-cap018","k":"screen","t":"CAP018","s":"Booking / rebooking of shipments onto trucks (inferred from defect 'holding duplicate trips when rebooking' and 'CAP018 and TRK001 do not match manifested pieces').","b":[["kv",[["What it does","Booking / rebooking of shipments onto trucks (inferred from defect 'holding duplicate trips when rebooking' and 'CAP018 and TRK001 do not match manifested pieces')."],["Why it matters / when","Expect to use when moving freight between trucks; double-check against TRK001 because of the open defect."]]]],"src":"d-fieldguide","tags":["booking","cap018","icargo","move freight","rebooking","screen"],"conf":"Inferred","links":[],"d":"14 Oct 2026"},{"id":"scr-cap141","k":"screen","t":"CAP141","s":"An approval queue – defect: 'AWBs reappearing on CAP141 after being approved'.","b":[["kv",[["What it does","An approval queue – defect: 'AWBs reappearing on CAP141 after being approved'."],["Why it matters / when","Likely where booking approvals (e.g. DG / special cargo on trucks) are worked. Confirm."]]]],"src":"d-fieldg ","t":"RPT002 report: Domestic and International On Time Performance","s":"DEP/NFD performance by hub.","b":[["p","DEP/NFD performance by hub."],["p","Open from RPT002 List Dashboard. Favourites today: Station Pulse Check, Truck Departure Delay Report, Trucking Dashboard."]],"src":"d-blueprint","tags":["dep","nfd","otp","report","rpt002"],"conf":"Confirmed (screenshot, 18 Oct)","links":[{"l":"RPT002 screen","r":"scr-rpt002"}],"d":"18 Oct 2026"},{"id":"note-arrival-order-of-operations","k":"note","t":"Arrival order of operations","s":"Order of operations for arrivals: arrive the truck → arrive the AWB → update the pickup log (scheduled pickups) → alert the customer/vendor.","b":[["p","Order of operations for arrivals: arrive the truck → arrive the AWB → update the pickup log (scheduled pickups) → alert the customer/vendor. When arriving for customers or vendors, use the station-specific party (e.g. JAS-AMS, FedEx-AMS)."]],"src":"d-fieldguide","tags":["icargo","remember","training note"],"conf":"From notes","links":[],"d":"14 Oct 2026"},{"id":"note-arriving-a-truck-vs-an-awb","k":"note","t":"Arriving a truck vs an AWB","s":"You can sometimes arrive an AWB without arriving the truck, and most coordinators can arrive a truck.","b":[["p","You can sometimes arrive an AWB without arriving the truck, and most coordinators can arrive a truck. If Tableau shows a truck not arrived, either email the vendor for status or, if you know it delivered, fill the gap in iCargo – otherwise the tracking is pointless."]],"src":"d-fieldguide","tags":["icargo","remember","training note"],"conf":"From notes","links":[],"d":"14 Oct 2026"},{"id":"note-date-suffixes-s-and-e","k":"note","t":"Date suffixes S and E","s":"Dates ending in S are scheduled, E are estimated.","b":[["p","Dates ending in S are scheduled, E are estimated."]],"src":"d-fieldguide","tags":["icargo","remember","training note"],"conf":"From notes","links":[],"d":"14 Oct 2026"},{"id":"note-two-hour-dep-nfd-window","k":"note","t":"Two-hour DEP/NFD window","s":"You have 2 hours on departures and arrivals before it counts as an impact to the station (DEP / NFD).","b":[["p","You have 2 hours on departures and arrivals before it counts as an impact to the station (DEP / NFD)."]],"src":"d-fieldguide","tags":["icargo","remember","training note"],"conf":"From notes","links":[],"d":"14 Oct 2026"},{"id":"note-unilode-rules-wl-reefer-acid","k":"note","t":"Unilode rules (WL = reefer, ACID)","s":"Unilode: transferring station and destination must match; WL = reefer; use the ACID to track and trace a PMC.","b":[["p","Unilode: transferring station and destination must match; WL = reefer; use the ACID to track and trace a PMC."]],"src":"d-fieldguide","tags":["icargo","remember","training note"],"conf":"From notes","links":[],"d":"14 Oct 2026"},{"id":"note-pmcs-per-international-truck","k":"note","t":"PMCs per international truck","s":"International trucks usually carry 4 PMCs; some AMS 'mega' trucks can move 7.","b":[["p","International trucks usually carry 4 PMCs; some AMS 'mega' trucks can move 7."]],"src":"d-fieldguide","tags":["icargo","remember","training note"],"conf":"From notes","links":[],"d":"14 Oct 2026"},{"id":"note-one-customer-per-truck-for-pmcs","k":"note","t":"One customer per truck for PMCs","s":"A truck can carry one customer's PMCs – even with space left you cannot mix customers for PMCs (your note says 'one PAL … assigned by customer'; confirm the exact term).","b":[["p","A truck can carry one customer's PMCs – even with space left you cannot mix customers for PMCs (your note says 'one PAL … assigned by customer'; confirm the exact term)."]],"src":"d-fieldguide","tags":["icargo","remember","training note"],"conf":"From notes","links":[],"d":"14 Oct 2026"},{"id":"note-ddx-light-vs-full-stations","k":"note","t":"DDX light vs full stations","s":"DDX light vs full: stations in yellow are FULL stations needing more paperwork; there is one one-off exception.","b":[["p","DDX light vs full: stations in yellow are FULL stations needing more paperwork; there is one one-off exception."]],"src":"d-fieldguide","tags":["icargo","remember","training note"],"conf":"From notes","links":[],"d":"14 Oct 2026"},{"id":"note-fsu-messaging-is-international-only","k":"note","t":"FSU messaging is international only","s":"FSU messaging is international only.","b":[["p","FSU messaging is international only."]],"src":"d-fieldguide","tags":["icargo","remember","training note"],"conf":"From notes","links":[],"d":"14 Oct 2026"},{"id":"report-wfh-task-assignment","k":"report","t":"WFH task assignment","s":"The day's task split: Inbox, DDX arrivals, Forward Air trucks, Late trucks folder, Scheduled DPU/DDX, PU/D pre-alerts, Truck Departure Delay Report, Mexico trucks, Ad hocs today…","b":[["kv",[["When","Every morning, reply at end of shift"],["Who sends / where","A team member to the trucking DL"],["What it contains","The day's task split: Inbox, DDX arrivals, Forward Air trucks, Late trucks folder, Scheduled DPU/DDX, PU/D pre-alerts, Truck Departure Delay Report, Mexico trucks, Ad hocs today & tomorrow, Trace."],["What to do","Do your assigned tasks; reply 'All tasks worked' with the late-truck list (date, truck, vendor, lane) before you log off."]]]],"src":"d-fieldguide","tags":["assignment","email","recurring","report","task","wfh"],"conf":"Confirmed","links":[],"d":"14 Oct 2026"},{"id":"report-daily-sit-and-coc-tour-report","k":"report","t":"Daily Sit and COC Tour Report","s":"Yesterday and MTD tonnage, refusals, accommodation, DEP performance by product (from RPT002) by hub and region, cargo delays, Tour Report irregularities.","b":[["kv",[["When","~07:50 daily"],["Who sends / where","COC"],["What it contains","Yesterday and MTD tonnage, refusals, accommodation, DEP performance by product (from RPT002) by hub and region, cargo delays, Tour Report irregularities."],["What to do","Scan hub DEP % and any irregularity on a truck lane. Tour Report items can open a trace case ('created as part of MSCA Ops/Tour Report'). Note: EK does not accept 'no' after 7 days on Expedite / ConfirmedFS; for TC you need the reason it was not delivered and the remedy (your notes)."]]]],"src":"d-fieldguide","tags":["and","coc","daily","email","recurring","report","sit","tour"],"conf":"Confirmed","links":[],"d":"14 Oct 2026"},{"id":"report-trucking-turnover","k":"report","t":"Trucking Turnover","s":"Flagged inbox items; trucking queues; BDCs; open iCargo defects (ADO numbers); pending RM / quotes; Mexico shipments; customs holds; trucks cleared for perishables, firearms,…","b":[["kv",[["When","End of each shift (~17:00)"],["Who sends / where","AA.Trucking to trucking DL + COC"],["What it contains","Flagged inbox items; trucking queues; BDCs; open iCargo defects (ADO numbers); pending RM / quotes; Mexico shipments; customs holds; trucks cleared for perishables, firearms, tobacco, liquor, DGs, PMCs; schedule changes; late trucks; cancellations; wait times & TONUs; PU/D truck status; +1/+2 trucking; open trace table."],["What to do","This is the hand-off. Update your sections before sending. It is the template for the end-of-shift checklist in section 3."]]]],"src":"d-fieldguide","tags":["email","recurring","report","trucking","turnover"],"conf":"Confirmed","links":[],"d":"14 Oct 2026"},{"id":"report-truck-departure-delay-report","k":"report","t":"Truck Departure Delay Report","s":"Trucks that left late.","b":[["kv",[["When","Daily (WFH task)"],["Who sends / where","Team task"],["What it contains","Trucks that left late. Your notes link it to manning ('9 hours max OT')."],["What to do","Contact the vendor for a revised ETA, assess whether the delay affects connections, alert the station. Arrivals >1 hour late go on the Truck Report Card."]]]],"src":"d-fieldguide","tags":["delay","departure","email","recurring","report","truck"],"conf":"Confirmed","links":[],"d":"14 Oct 2026"},{"id":"report-late-truck-emails","k":"report","t":"Late truck emails","s":"Subject format 'TRK ####/DDMMM delayed' with Kim's preferred wording and the AWB numbers (your notes).","b":[["kv",[["When","As needed"],["Who sends / where","AA.Trucking"],["What it contains","Subject format 'TRK ####/DDMMM delayed' with Kim's preferred wording and the AWB numbers (your notes)."],["What to do","Use the standard wording; send to the station and affected parties; log in the Report Card."]]]],"src":"d-fieldguide","tags":["email","emails","late","recurring","report","truck"],"conf":"Confirmed","links":[],"d":"14 Oct 2026"},{"id":"report-ddx-ad-hoc-alerts","k":"report","t":"DDX / ad hoc alerts","s":"Truck, date, pickup and delivery addresses and hours, AWBs and PMCs, vendor; standard line asking for ATA within 2 hours and POD within 24 hours.","b":[["kv",[["When","Per truck"],["Who sends / where","AA.Trucking to station/vendor"],["What it contains","Truck, date, pickup and delivery addresses and hours, AWBs and PMCs, vendor; standard line asking for ATA within 2 hours and POD within 24 hours."],["What to do","Send when awarded; chase ATA and POD; update the PUD tracker."]]]],"src":"d-fieldguide","tags":["/","ad","alerts","ddx","email","hoc","recurring","report"],"conf":"Confirmed","links":[],"d":"14 Oct 2026"},{"id":"report-ad-hoc-bid-requests","k":"report","t":"Ad hoc bid requests","s":"Lane, weight, equipment, deadline (24 h notice, 48 h for special equipment / international).","b":[["kv",[["When","~80–100 trucks a week"],["Who sends / where","AA.Trucking, BCC to vendor lists"],["What it contains","Lane, weight, equipment, deadline (24 h notice, 48 h for special equipment / international)."],["What to do","Compare bid AND lane performance; award with the 'Winning Bid' template; set up in FLT003."]]]],"src":"d-fieldguide","tags":["ad","bid","email","hoc","recurring","report","requests"],"conf":"Confirmed","links":[],"d":"14 Oct 2026"},{"id":"report-vendor-eta-pod-no-show-replies","k":"report","t":"Vendor ETA / POD / no-show replies","s":"ETAs, PODs, 'truck cancelled – cargo no show', detention claims.","b":[["kv",[["When","All day"],["Who sends / where","Vendors (Accelerated, TGT, FlyUs, Arrive, WFS…)"],["What it contains","ETAs, PODs, 'truck cancelled – cargo no show', detention claims."],["What to do","Update tracker; no-shows and detention need checking (GPS, CCTV, Tableau) before any charge is accepted."]]]],"src":"d-fieldguide","tags":["/","email","eta","no-show","pod","recurring","replies","report","vendor"],"conf":"Confirmed","links":[],"d":"14 Oct 2026"},{"id":"report-central-trace-emails","k":"report","t":"Central Trace emails","s":"Searches, CCTV, customer photos on trace cases.","b":[["kv",[["When","All day"],["Who sends / where","Cargo.Trace"],["What it contains","Searches, CCTV, customer photos on trace cases."],["What to do","Provide movement evidence (manifest, EUV/no-stop status, POD); update the trace log."]]]],"src":"d-fieldguide","tags":["central","email","emails","recurring","report","trace"],"conf":"Confirmed","links":[],"d":"14 Oct 2026"},{"id":"report-monthly-fuel-surcharge","k":"report","t":"Monthly fuel surcharge","s":"Domestic fuel % (e.g.","b":[["kv",[["When","Start of month"],["Who sends / where","Amy Bryant"],["What it contains","Domestic fuel % (e.g. 39.5% April, 41% June 2026), from US diesel price and contract."],["What to do","No action for coordinators; Finance uses it for forecast."]]]],"src":"d-fieldguide","tags":["email","fuel","monthly","recurring","report","surcharge"],"conf":"Confirmed","links":[],"d":"14 Oct 2026"},{"id":"report-weekly-truck-schedule","k":"report","t":"Weekly truck schedule","s":"Published schedule (~700 trucks, ~150 run on a typical day).","b":[["kv",[["When","Every Thursday"],["Who sends / where","Trucking to CargoRPA mailbox"],["What it contains","Published schedule (~700 trucks, ~150 run on a typical day)."],["What to do","Feeds the bots; mid-week changes are not always reflected."]]]],"src":"d-fieldguide","tags":["email","recurring","report","schedule","truck","weekly"],"conf":"Confirmed","links":[],"d":"14 Oct 2026"},{"id":"report-rebooking-overbooked-truck-bot-results","k":"report","t":"Rebooking / Overbooked-truck bot results","s":"Processed AWB files.","b":[["kv",[["When","Daily"],["Who sends / where","RPA (Praveen / Gokul)"],["What it contains","Processed AWB files."],["What to do","If nothing comes back, the VM may be busy with the TRK001 bot. Rebook manually if time-critical."]]]],"src":"d-fieldguide","tags":["/","bot","email","overbooked-truck","rebooking","recurring","report","results"],"conf":"Confirmed","links":[],"d":"14 Oct 2026"},{"id":"report-undeliverable-bounces","k":"report","t":"Undeliverable bounces","s":"Bad vendor/station addresses.","b":[["kv",[["When","—"],["Who sends / where","Outlook"],["What it contains","Bad vendor/station addresses."],["What to do","Fix the address list; resend."]]]],"src":"d-fieldguide","tags":["bounces","email","recurring","report","undeliverable"],"conf":"Confirmed","links":[],"d":"14 Oct 2026"},{"id":"check-end-of-shift","k":"check","t":"Before you leave: end-of-shift checklist","s":"Work top to bottom; anything you cannot close goes in the Turnover with an owner.","b":[["h","Inbox and queues"],["check",["Shared inbox: nothing unread or unflagged in your section; everything still open is flagged and listed in the Turnover.","iCargo trucking queues cleared for the turnover window; BDCs listed or 'None'.","Pending RM / quote emails moved to the Pending Quotes/RM folder."]],["h","Tonight's and tomorrow's trucks"],["check",["Ad hocs today and tomorrow: booking exists, no delay, AWB customs status checked, freight ready – in that order before dispatch.","Any ad hoc departing within ~36 hours with no booking or cargo: confirm with Sales or cancel inside the vendor's window (6–24 h) to avoid a full charge.","Special cargo cleared and listed: perishables (reefer), firearms, tobacco, liquor, DGs, PMCs (DFW, LAX, MIA, ORD, PHX). For firearms and tobacco the vendor must confirm receipt and that they can actually move it.","Schedule changes entered in iCargo and listed (holidays, station events)."]],["h","Arrivals, pickups and deliveries"],["check",["DDX arrivals: truck arrived → AWB arrived → pickup log updated → customer/vendor alerted, within 2 hours of arrival.","PUD tracker: every pickup/delivery due today has a status. A blank means it was not worked. Pickups have a TLM ID; deliveries are DLVD or 'arrived – pending POD'.","TSA form sent for every US direct pickup (driver name from the vendor; update if the driver changes).","PODs chased for arrivals older than 24 hours."]],["h","Exceptions and logs"],["check",["Late trucks (>1 hour) reported and entered in the Truck Report Card with reason and fault.","Cancelled trucks listed with the reason.","Wait times and TONUs entered in the ad hoc log: every TONU has an arrival time; fee charged back on the live AWB.","Mexico trucks and customs holds updated (WFH monitoring includes customs and Mexico trucks).","Trace: today's TRC009 truck cases have a comment in the TRACE log and the open table is in the Turnover.","Tour Report / Sit report items on truck lanes followed up.","New iCargo defects added to the Turnover defect list with the ADO number."]],["h","Send"],["check",["Turnover sent; WFH reply sent with 'All tasks worked' and the late-truck list."]]],"src":"d-fieldguide","tags":["checklist","closing","end of shift","inbox","queues","turnover"],"conf":"Confirmed","links":[],"d":"14 Oct 2026"},{"id":"note-trucks-dashboard-will-update-24-hrs","k":"note","t":"Trucks dashboard will update 24 hrs","s":"The Tableau truck-status report refreshes once a day; same-day data has blank arrival times for 6–8 hours (Wall Walk).","b":[["quote","Trucks dashboard will update 24 hrs"],["p","The Tableau truck-status report refreshes once a day; same-day data has blank arrival times for 6–8 hours (Wall Walk). Live refresh was discussed, not built."]],"src":"d-fieldguide","tags":["dashboard","handwritten","hrs","training note","trucks","update","will"],"conf":"From notes","links":[],"d":"14 Oct 2026"},{"id":"note-after-7-days-expedite-confirmedfs-ek-does-not-ta","k":"note","t":"After 7 days Expedite & ConfirmedFS → EK does not take no for an answer. For TC, need a reason if not delivered & how they remedy","s":"Escalation rule for aged shipments.","b":[["quote","After 7 days Expedite & ConfirmedFS → EK does not take no for an answer. For TC, need a reason if not delivered & how they remedy"],["p","Escalation rule for aged shipments. Confirm whether 'EK' is a person/customer or Emirates and write the rule down."]],"src":"d-fieldguide","tags":["after","confirmedfs","days","does","expedite","handwritten","not","training note"],"conf":"From notes","links":[],"d":"14 Oct 2026"},{"id":"note-tableau-update-reporting-time-discrep","k":"note","t":"Tableau update reporting time discrep.","s":"Known gap: arrival scan time vs real arrival.","b":[["quote","Tableau update reporting time discrep."],["p","Known gap: arrival scan time vs real arrival. Ask Praveen for the exact logic."]],"src":"d-fieldguide","tags":["discrep","handwritten","reporting","tableau","time","training note","update"],"conf":"From notes","links":[],"d":"14 Oct 2026"},{"id":"note-fsu-messaging-int-l-only","k":"note","t":"FSU messaging Int'l only","s":"Status messages go to international parties only.","b":[["quote","FSU messaging Int'l only"],["p","Status messages go to international parties only."]],"src":"d-fieldguide","tags":["fsu","handwritten","int","messaging","only","training note"],"conf":"From notes","links":[],"d":"14 Oct 2026"},{"id":"note-sometimes-you-can-arrive-the-awb-w-o-arriving-tr","k":"note","t":"Sometimes you can arrive the AWB w/o arriving truck … if you check Tableau, see it hasn't arrived, & don't switch to arrive, what's the point of tracking?","s":"Close the loop: chase the vendor or arrive it in iCargo so reports stay accurate.","b":[["quote","Sometimes you can arrive the AWB w/o arriving truck … if you check Tableau, see it hasn't arrived, & don't switch to arrive, what's the point of tracking?"],["p","Close the loop: chase the vendor or arrive it in iCargo so reports stay accurate. This is the root of many 'posting delay' traces."]],"src":"d-fieldguide","tags":["arrive","awb","can","handwritten","sometimes","the","training note","you"],"conf":"From notes","links":[],"d":"14 Oct 2026"},{"id":"note-trk-truck-date-delayed-w-kim-s-preferred-wording","k":"note","t":"\"TRK #truck/date delayed\" w/ Kim's preferred wording + AWB #","s":"Standard delay email subject.","b":[["quote","\"TRK #truck/date delayed\" w/ Kim's preferred wording + AWB #"],["p","Standard delay email subject. Ask Kim for the exact body text and add it to the templates."]],"src":"d-fieldguide","tags":["date","delayed","handwritten","kim","preferred","training note","trk","truck"],"conf":"From notes","links":[],"d":"14 Oct 2026"},{"id":"note-likes-tableau-since-it-matches-what-will-eventua","k":"note","t":"Likes Tableau since it matches what will eventually 'happen'","s":"Kim treats Tableau as the reliable record once data settles.","b":[["quote","Likes Tableau since it matches what will eventually 'happen'"],["p","Kim treats Tableau as the reliable record once data settles."]],"src":"d-fieldguide","tags":["handwritten","likes","matches","since","tableau","training note","what","will"],"conf":"From notes","links":[],"d":"14 Oct 2026"},{"id":"note-any-way-to-get-reporting-directly-from-icargo-tr","k":"note","t":"Any way to get reporting directly from iCargo? Trucking Tableau report goes hand in hand w/ trace. Where is data for Tableau sourced? Where are slides sourced?","s":"Open. Tableau uses AWB arrival-scan timestamps from shipment history (Praveen, Wall Walk).","b":[["quote","Any way to get reporting directly from iCargo? Trucking Tableau report goes hand in hand w/ trace. Where is data for Tableau sourced? Where are slides sourced?"],["p","Open. Tableau uses AWB arrival-scan timestamps from shipment history (Praveen, Wall Walk). Underlying database not confirmed. Finance slides come from TLM/SAP (MC01) and Hyperion, not iCargo."]],"src":"d-fieldguide","tags":["any","directly","from","get","handwritten","reporting","training note","way"],"conf":"From notes","links":[],"d":"14 Oct 2026"},{"id":"note-screen-flt003-for-push-update-it-to-other","k":"note","t":"Screen FLT003 for push → update it to [?] / [?], other","s":"Unclear words. Ask what FLT003 'push' updates and write the steps.","b":[["quote","Screen FLT003 for push → update it to [?] / [?], other"],["p","Unclear words. Ask what FLT003 'push' updates and write the steps."]],"src":"d-fieldguide","tags":["flt","for","handwritten","other","push","screen","training note","update"],"conf":"From notes","links":[],"d":"14 Oct 2026"},{"id":"note-the-only-way-to-have-no-dep-or-nfd-failures-is-t","k":"note","t":"The only way to have no DEP or NFD failures is to be open 24/7 → get some clarity on AMS example → there's a check to see if these 'failures' actually are failures or need to be arrived → Accounting vs Trucking on import charges","s":"Open item: AMS example; who owns import charges.","b":[["quote","The only way to have no DEP or NFD failures is to be open 24/7 → get some clarity on AMS example → there's a check to see if these 'failures' actually are failures or need to be arrived → Accounting vs Trucking on import charges"],["p","Open item: AMS example; who owns import charges. Some 'failures' are just un-arrived trucks."]],"src":"d-fieldguide","tags":["dep","handwritten","have","nfd","only","the","training note","way"],"conf":"From notes","links":[],"d":"14 Oct 2026"},{"id":"note-usually-int-l-trucks-4-pmcs-but-some-ams-trucks","k":"note","t":"Usually int'l trucks = 4 PMCs, but some AMS trucks can move 7 on Mega trucks","s":"MEGA equipment code appears in the ad hoc log.","b":[["quote","Usually int'l trucks = 4 PMCs, but some AMS trucks can move 7 on Mega trucks"],["p","MEGA equipment code appea
