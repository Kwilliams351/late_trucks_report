rs in the ad hoc log."]],"src":"d-fieldguide","tags":["but","handwritten","int","pmcs","some","training note","trucks","usually"],"conf":"From notes","links":[],"d":"14 Oct 2026"},{"id":"note-ddx-for-light-vs-full-in-yellow-only-full-statio","k":"note","t":"DDX for light vs full → in yellow only full stations which req. more paperwork; one one-off","s":"Which list is 'in yellow'?","b":[["quote","DDX for light vs full → in yellow only full stations which req. more paperwork; one one-off"],["p","Which list is 'in yellow'? Probably the DDX/PUD sheet. Confirm the one-off."]],"src":"d-fieldguide","tags":["ddx","for","full","handwritten","light","only","training note","yellow"],"conf":"From notes","links":[],"d":"14 Oct 2026"},{"id":"note-manning-9-hours-max-ot-truck-departure-delay-rep","k":"note","t":"Manning = 9 hours max OT → Truck Departure Delay Report","s":"Confirm whether 9 hours refers to driver hours or station manning.","b":[["quote","Manning = 9 hours max OT → Truck Departure Delay Report"],["p","Confirm whether 9 hours refers to driver hours or station manning."]],"src":"d-fieldguide","tags":["delay","departure","handwritten","hours","manning","max","training note","truck"],"conf":"From notes","links":[],"d":"14 Oct 2026"},{"id":"note-trucks-report-every-truck-needs-arrival-sans-tra","k":"note","t":"Trucks report: every truck needs arrival sans transfer; TONUs should have arrival to show when TONU happened (can book hour later on TONU fee day); we charge back on live AWB so we're not out of pocket","s":"Rules built into the new ad hoc template (arrival time required for TONU; 'fee charged back' column).","b":[["quote","Trucks report: every truck needs arrival sans transfer; TONUs should have arrival to show when TONU happened (can book hour later on TONU fee day); we charge back on live AWB so we're not out of pocket"],["p","Rules built into the new ad hoc template (arrival time required for TONU; 'fee charged back' column)."]],"src":"d-fieldguide","tags":["arrival","every","handwritten","needs","report","training note","truck","trucks"],"conf":"From notes","links":[],"d":"14 Oct 2026"},{"id":"ref-current-tracker-files-and-their-problems","k":"ref","t":"Current tracker files and their problems","s":"Ad hoc, Domestic PUD and TRACE workbooks: how they are built today and why multi-user entry breaks.","b":[["tbl",["File","Current structure","Problems for daily multi-user entry"],[["Adhoc trucks – 2026.xlsx","One tab per truck range (EUVI, MAL, CONI, COND, LTL and others) plus a TONU / Wait log with monthly and fee-type summaries. Columns: Trip, Date, From, To, Amount, Currency, Vendor, Code #, Auth, Charge-back station, Type, ULD/PMC, TONU fee added to AWB, Customer, Comment, DOW, Month.","Same columns repeated on every tab; status (CXLD, TONU, rebooked) hidden in Comment; DOW and Month typed by hand; mixed currencies with no USD column; 'Dummy Vendor' placeholders; at least one 1900 date; the file holds ~2.2 million mostly-empty formatted rows, so search and AI tools could not read most of it."],["Domestic PUD Tracking sheet.xlsx","One tab per month (~100 tabs since 2020). Rows = day of month, columns = truck/lane (7026–7550), cell = TLM ID, DLVD, NO-OP, CXLD, TONU, Arrived or free text. Rule: PU → TLM ID, D → DLVD, no-op → NO-OP.","A grid cannot hold reason, vendor, POD or TSA status; free text inside cells; 'NO-OP' / 'no-op' casing; a new tab copied every month; impossible to report on without retyping. Blank = not worked is a useful control and is kept in the new design."],["TRACE 2026.xlsx","One tab per day (600 tabs since Jan 2025). Each tab re-pastes the TRC009 export plus a 'Trucking comment'. ~12,700 rows for 3,870 unique AWBs.","Rows copied forward daily; 6 spellings of the comment header; 2 unreadable tabs; no owner, class, outcome or closed date; most common final comment is a bare 'Trace closed'."]]]],"src":"d-fieldguide","tags":["ad hoc","excel","pud","trace","tracker"],"conf":"Confirmed","links":[],"d":"14 Oct 2026"},{"id":"ref-tracker-standard-one-table-one-row-per-event","k":"ref","t":"Tracker standard: one table, one row per event","s":"No tabs per day or month; drop-downs, formulas and a 'Today' control tab.","b":[["ul",["One table per tracker, one row per event (truck, pickup/delivery, trace case). No tabs per day or month – filter by date instead.","Drop-downs for station, vendor, status, fee type, class, owner; values kept on one Lists tab.","Formulas, not typing, for day, month, days open and truck type (looked up from the SharePoint truck-number ranges).","Status columns replace status-in-comments; comments are for the why.","Built-in controls: a 'Today' tab counts what is still open (blank PUD statuses, pickups with no TLM ID, ad hocs within 36 h with no AWB, TONUs with no arrival time, overdue trace follow-ups). Rows turn yellow/red when they break a rule.","Co-authoring safe: Excel table, no merged cells, no macros, AutoSave on, personal filters through Sheet View, Updated by / Updated on columns.","The attached workbook Surface_Logistics_Daily_Trackers_Template.xlsx implements this with example rows (marked for deletion). Historical data is not migrated; the old files stay as the archive."]],["h","Recommended home: Microsoft Lists"],["ul",["Excel co-authoring works, but a shared list is the better fit for many people updating rows all day:","Each row is saved separately, so two people never overwrite each other.","Created by / Modified by and full version history are automatic – no 'Updated by' column to forget.","Required fields and choice columns enforce the rules; forms work on a phone at the dock.","Views per person or station ('My open PUDs', 'Trace overdue'), and Power Automate can send the 36-hour ad hoc alert or a day-before customer reminder.","Lists export to Excel or Power BI for the report card and leadership views.","Use the same column names as the template so the move is a copy-paste. Ask the SharePoint site owner (Kim / site admins) to create the lists on the AACargoTrucking site."]]],"src":"d-trackers","tags":["co-authoring","microsoft lists","standard","tracker"],"conf":"Proposal","links":[],"d":"14 Oct 2026"},{"id":"ref-ad-hoc-tracker-required-fields-and-rules","k":"ref","t":"Ad hoc tracker: required fields and rules","s":"Fee type ≠ None needs fee amount and 'charged back on AWB'; TONU needs arrival time; approver initials and RM reference for new lanes.","b":[["kv",[["Required fields","Truck #, truck date, category, origin, destination, vendor, requested by, rate, currency, status"],["Rules","Fee type ≠ None needs fee amount and 'charged back on AWB'; TONU needs arrival time; approver initials and RM reference for new lanes."]]]],"src":"d-trackers","tags":["ad hoc","fields","rules","tracker"],"conf":"Proposal","links":[],"d":"14 Oct 2026"},{"id":"ref-pud-tracker-required-fields-and-rules","k":"ref","t":"PUD tracker: required fields and rules","s":"PU needs TLM ID unless NO-OP/CXLD; US PU needs TSA form; arrived deliveries need POD within 24 h.","b":[["kv",[["Required fields","Date, truck #, PU/D, origin, destination, vendor, status"],["Rules","PU needs TLM ID unless NO-OP/CXLD; US PU needs TSA form; arrived deliveries need POD within 24 h."]]]],"src":"d-trackers","tags":["fields","pud","rules","tracker"],"conf":"Proposal","links":[],"d":"14 Oct 2026"},{"id":"ref-trace-tracker-required-fields-and-rules","k":"ref","t":"Trace tracker: required fields and rules","s":"Closed status needs closed date and an outcome-specific status (located / unsuccessful / not trucking). Class A–F: physical; manifest/execution; arrival/posting delay; data/sync; vendor/station follow-up; not trucking-owned.","b":[["kv",[["Required fields","AWB, truck #, last reported airport, disc code, TC open date, class, owner, status, next action, follow-up due"],["Rules","Closed status needs closed date and an outcome-specific status (located / unsuccessful / not trucking). Class A–F: physical; manifest/execution; arrival/posting delay; data/sync; vendor/station follow-up; not trucking-owned."]]]],"src":"d-trackers","tags":["fields","rules","trace","tracker"],"conf":"Proposal","links":[],"d":"14 Oct 2026"},{"id":"opp-ad-hoc-no-booking-within-36-h-alert-and-day-befo","k":"opp","t":"Ad hoc 'no booking within 36 h' alert and day-before customer reminder","s":"Wall Walk: full-truck charge at least monthly, usually PHL; vendor cancel windows 6–24 h","b":[["kv",[["Evidence","Wall Walk: full-truck charge at least monthly, usually PHL; vendor cancel windows 6–24 h"],["First step","Status + date columns in the new ad hoc tracker; Power Automate alert once it is a List"],["Effort","Low"]]]],"src":"d-fieldguide","tags":["alert","and","booking","hoc","opportunity","within"],"conf":"Effort: Low","links":[],"d":"14 Oct 2026"},{"id":"opp-auto-build-the-turnover","k":"opp","t":"Auto-build the Turnover","s":"Turnover is retyped daily from the same sections","b":[["kv",[["Evidence","Turnover is retyped daily from the same sections"],["First step","Generate sections from the trackers and Trucking Pulse notes"],["Effort","Medium"]]]],"src":"d-fieldguide","tags":["auto","build","opportunity","the","turnover"],"conf":"Effort: Medium","links":[],"d":"14 Oct 2026"},{"id":"opp-truck-report-card-from-tableau","k":"opp","t":"Truck Report Card from Tableau","s":"Every truck >1 h late is entered by hand; Tableau already compares scan time to schedule","b":[["kv",[["Evidence","Every truck >1 h late is entered by hand; Tableau already compares scan time to schedule"],["First step","Ask Praveen for a daily export of late arrivals to pre-fill the report card"],["Effort","Medium"]]]],"src":"d-fieldguide","tags":["card","from","opportunity","report","tableau","truck"],"conf":"Effort: Medium","links":[],"d":"14 Oct 2026"},{"id":"opp-rebooking-bot-visibility","k":"opp","t":"Rebooking bot visibility","s":"Near-daily failures; bot waits in queue behind the TRK001 bot (Sep–Oct 2026 thread)","b":[["kv",[["Evidence","Near-daily failures; bot waits in queue behind the TRK001 bot (Sep–Oct 2026 thread)"],["First step","Incident tracker + 'bot in queue' notice, as EJ suggested"],["Effort","Low–Medium"]]]],"src":"d-fieldguide","tags":["bot","opportunity","rebooking","visibility"],"conf":"Effort: Low–Medium","links":[],"d":"14 Oct 2026"},{"id":"opp-extreme-dimension-alert-for-trucks","k":"opp","t":"Extreme-dimension alert for trucks","s":"1x1x1 and 7,849 CBM bookings found by hand (Kim, 6 Oct); Andres asked Roman to extend the extreme-dim report to trucking","b":[["kv",[["Evidence","1x1x1 and 7,849 CBM bookings found by hand (Kim, 6 Oct); Andres asked Roman to extend the extreme-dim report to trucking"],["First step","Follow up on Roman's extension"],["Effort","Low (owned by IT)"]]]],"src":"d-fieldguide","tags":["alert","dimension","extreme","for","opportunity","trucks"],"conf":"Effort: Low (owned by IT)","links":[],"d":"14 Oct 2026"},{"id":"opp-ad-hoc-rate-requests","k":"opp","t":"Ad hoc rate requests","s":"80–100 ad hoc trucks a week, all bid by email","b":[["kv",[["Evidence","80–100 ad hoc trucks a week, all bid by email"],["First step","Rate lock for repeat lanes below a threshold; templated bid emails with a reply parser later"],["Effort","Medium"]]]],"src":"d-fieldguide","tags":["hoc","opportunity","rate","requests"],"conf":"Effort: Medium","links":[],"d":"14 Oct 2026"},{"id":"opp-tonu-cancellation-fees","k":"opp","t":"TONU / cancellation fees","s":"Oct 2024–Sep 2025 log: 515 fee events, about $149K (TONU 239, ~$103K; wait 209, ~$29K); customer fee (~$200) does not change behaviour","b":[["kv",[["Evidence","Oct 2024–Sep 2025 log: 515 fee events, about $149K (TONU 239, ~$103K; wait 209, ~$29K); customer fee (~$200) does not change behaviour"],["First step","Monthly TONU by requester view from the new tracker; propose fee policy with Sales"],["Effort","Low"]]]],"src":"d-fieldguide","tags":["cancellation","fees","opportunity","tonu"],"conf":"Effort: Low","links":[],"d":"14 Oct 2026"},{"id":"opp-ddx-direct-delivery-flag","k":"opp","t":"DDX / direct delivery flag","s":"Destination stations confuse customer deliveries with inbound trucks","b":[["kv",[["Evidence","Destination stations confuse customer deliveries with inbound trucks"],["First step","SCC code or scribble-pad standard; bot could add it"],["Effort","Medium (iCargo)"]]]],"src":"d-fieldguide","tags":["ddx","delivery","direct","flag","opportunity"],"conf":"Effort: Medium (iCargo)","links":[],"d":"14 Oct 2026"},{"id":"opp-trace-log","k":"opp","t":"Trace log","s":"See trace one-pager","b":[["kv",[["Evidence","See trace one-pager"],["First step","Move to the Trace table now; classify A–F"],["Effort","Low"]]]],"src":"d-fieldguide","tags":["log","opportunity","trace"],"conf":"Effort: Low","links":[],"d":"14 Oct 2026"},{"id":"opp-open-icargo-defects","k":"opp","t":"Open iCargo defects","s":"Some ADO items date from 2024 (empty TOs with charges, duplicate TOs, CAP018/TRK001 mismatch)","b":[["kv",[["Evidence","Some ADO items date from 2024 (empty TOs with charges, duplicate TOs, CAP018/TRK001 mismatch)"],["First step","Quarterly review with IBS / Richard; quantify impact"],["Effort","Low"]]]],"src":"d-fieldguide","tags":["defects","icargo","open","opportunity"],"conf":"Effort: Low","links":[],"d":"14 Oct 2026"},{"id":"ww-ad-hoc-truck-bidding","k":"ww","t":"Ad Hoc Truck Bidding","s":"Brian explained that every ad hoc truck, and initially scheduled trucks, received an emailed bid request sent by blind-copy to domestic and international vendor distribution…","b":[["ul",["Brian explained that every ad hoc truck, and initially scheduled trucks, received an emailed bid request sent by blind-copy to domestic and international vendor distribution lists so vendors could not see the other recipients","The team averaged approximately 80 to 100 ad hoc trucks per week, requiring the team to conduct bids or RFPs throughout the day and then collect and analyze the returned quotes"]]],"src":"d-wallwalk","tags":["bcc","bid","bidding","rfp","truck","vendor","wall walk"],"conf":"Practice (AI recap)","links":[],"d":"16 Sep 2026"},{"id":"ww-quote-management","k":"ww","t":"Quote Management","s":"The team requested quotes based on the shipment details and lane, such as 10,000 kilograms from London Heathrow to Amsterdam, and assigned a response deadline based on urgency…","b":[["ul",["The team requested quotes based on the shipment details and lane, such as 10,000 kilograms from London Heathrow to Amsterdam, and assigned a response deadline based on urgency and notice received. They generally requested 24 hours of notice, or 48 hours when special equipment or international handling was required","Quotes applied only to the specific move and stated timeframe. A project move could cover a defined period, such as three weeks on a Chicago-to-Philadelphia lane, while an ad hoc quote generally applied only to that individual shipment"]]],"src":"d-wallwalk","tags":["24 hours","48 hours","management","quote","wall walk"],"conf":"Practice (AI recap)","links":[],"d":"16 Sep 2026"},{"id":"ww-rate-automation","k":"ww","t":"Rate Automation","s":"Brian outlined two potential approaches for reducing the time spent on full-truck rate requests: lock in a rate for a defined period, such as one to three months, and use it…","b":[["ul",["Brian outlined two potential approaches for reducing the time spent on full-truck rate requests: lock in a rate for a defined period, such as one to three months, and use it while the rate remains below an agreed threshold, or automate the process of sending requests to vendors. Rate locking could reduce repeated requests but would require the contracts team to manage recurring contract periods, while email automation would still depend on vendors' response times","The team identified automated rate collection from customers or truckers as the most difficult part of the proposed workflow. Sending standardized email requests was considered relatively straightforward because templates already existed, while receiving and interpreting vendor replies would require additional automation","The proposed email workflow would collect requests by noon, trigger a Databricks job or similar process to send rate requests to the relevant vendor distribution lists, and potentially monitor the reply inbox so returned rates could be recognized immediately"]]],"src":"d-wallwalk","tags":["automation","databricks","rate","rate lock","wall walk"],"conf":"Practice (AI recap)","links":[],"d":"16 Sep 2026"},{"id":"ww-vendor-rates","k":"ww","t":"Vendor Rates","s":"The team confirmed that vendors generally did not publish usable rates online.","b":[["ul",["The team confirmed that vendors generally did not publish usable rates online. Even when a vendor displayed a rate, it would typically not be the negotiated rate the team would pay, so vendors still needed to provide rates and availability directly","Brian explained that vendor selection for ad hoc trucks depended on both rate and immediate capacity. A vendor might offer a lower rate but be unable to provide capacity until a later date, which would be too late for an urgent shipment. Ad hoc trucks typically lacked contracted rates and often came in below standard rates; for example, another vendor might quote 18 cents per pound compared with a contracted carrier's 25 cents per pound. For charter moves, Brian and Rebecca could compare competing bids when the potential savings justified the effort, while smaller savings on large programs might not warrant repeated negotiation","Brian said rate requests were sent entirely by email rather than phone. Phone outreach was generally reserved for cases where no response had arrived, a bid was about to close or had already closed, or Sales urgently needed a truck, at which point the team contacted vendors directly to seek capacity","After awarding a truck, the team emailed the winning vendor with the award details and sent the other bidders a blind- copied notification thanking them for participating and sharing the winning bid. Brian said vendors had provided positive feedback because learning the selected rate helped them understand the team’s expectations and helped keep future rates lower"]]],"src":"d-wallwalk","tags":["rates","vendor","wall walk"],"conf":"Practice (AI recap)","links":[],"d":"16 Sep 2026"},{"id":"ww-contracted-rates","k":"ww","t":"Contracted Rates","s":"For lanes with an existing contracted per-kilo rate, the team generally used that rate when requesting additional trailer capacity rather than issuing a new RFP.","b":[["ul",["For lanes with an existing contracted per-kilo rate, the team generally used that rate when requesting additional trailer capacity rather than issuing a new RFP. They first checked whether the shipment could fit an existing lane or whether only one carrier served the lane; for example, Norfolk had a single carrier because its volume was too low for other carriers, while additional trailers to Mexico City continued to use the contracted per-kilo rate. For full truckloads, the team could sometimes obtain a cheaper rate than the LTL rate for the shipment's weight","Brian proposed approaching the three vendors commonly used on a lane to request a rate lock at the current rate for a defined monthly volume, such as 100,000 kilograms, while allowing an exception for major market disruptions. A vendor with available capacity might accept the arrangement in exchange for more consistent business"]]],"src":"d-wallwalk","tags":["contract","contracted","per kilo","rate lock","rates","wall walk"],"conf":"Practice (AI recap)","links":[],"d":"16 Sep 2026"},{"id":"ww-equipment-capacity","k":"ww","t":"Equipment Capacity","s":"The team said roller-bed equipment had particularly high demand and low supply, making rapid outreach important.","b":[["ul",["The team said roller-bed equipment had particularly high demand and low supply, making rapid outreach important. They knew which vendors had roller beds and contacted those vendors directly, while still conducting a bid to support an auditable vendor-selection process rather than assigning freight based on preference","Brian explained that freight was assumed to be stackable in I Cargo unless a non-stackable flag was recorded, although booking errors sometimes caused the booking to differ from the physical freight. Beatrice’s team, gateway trucking desks, and vendor personnel serving as “boots on the ground” checked unusual shipments, sometimes by taking pictures, to determine whether an extra trailer or truck was required. Ad hoc trucks appeared in I Cargo only through their truck number","The team clarified that equipment-type codes distinguished FTL, LTL, dry-bed domestic, dry-bed international, mega double- decker trucks, and refrigerated equipment using codes such as REFD or REFI. Dry-ice shipments were expected to withstand the full transit time when packaged correctly, and the team had not yet encountered a case where a dry-ice shipment's delay required customer notification because the dry-ice supply was running out"]]],"src":"d-wallwalk","tags":["capacity","equipment","mega","refd","refi","rollerbed","wall walk"],"conf":"Practice (AI recap)","links":[],"d":"16 Sep 2026"},{"id":"ww-capacity-planning","k":"ww","t":"Capacity Planning","s":"Brian described trucking capacity as a highly variable landscape affected by seasonality and regional conditions.","b":[["ul",["Brian described trucking capacity as a highly variable landscape affected by seasonality and regional conditions. In the Atlanta region, trucking companies had recently requested rate increases beginning in April and May because of peach harvest activity, while driver shortages could also reduce available capacity. The team preferred scheduled trucks because every ad hoc move required an RFP and created substantial operational churn","Brian explained that trucking reviewed capacity for the current day and the following two days every day. When freight was tendered and capacity appeared insufficient, the team requested another truck; for origin trucks that appeared unused, they sometimes asked Sales to confirm the shipment before paying for capacity that might not be needed","Brian explained that the schedule contained slightly more than 700 trucks, but only approximately 150 operated on a typical day. The remaining trucks stayed open rather than blocking revenue because they could still be booked when needed","The published truck schedule was sent every Thursday to the CargoRPA email account, although changes could be made during the week and the team did not have time to update it daily. The schedule was loaded one quarter at a time, and Brian had completed the bulk upload for the fourth quarter approximately two weeks earlier","Brian clarified that customers could book cargo up to 10 days in advance, but the team generally treated the movement as a three-day operation and began firming up capacity within that window. If a truck was scheduled to depart in three days with no freight, the team typically waited until the day before to investigate whether it should remain scheduled"]]],"src":"d-wallwalk","tags":["700 trucks","capacity","cargorpa","planning","schedule","thursday","wall walk"],"conf":"Practice (AI recap)","links":[],"d":"16 Sep 2026"},{"id":"ww-ltl-and-shuttle-operations","k":"ww","t":"LTL and Shuttle Operations","s":"The team confirmed that LTL capacity could be filled to 100%, unlike a dedicated shuttle whose cost was incurred regardless of utilization.","b":[["ul",["The team confirmed that LTL capacity could be filled to 100%, unlike a dedicated shuttle whose cost was incurred regardless of utilization. Approximately 85% to nearly 90% of the schedule used LTLs because the company paid only for the capacity it placed on them, while scheduled shuttles were sometimes introduced to test demand and removed when Sales could not sell or use them"]]],"src":"d-wallwalk","tags":["operations","shuttle","wall walk"],"conf":"Practice (AI recap)","links":[],"d":"16 Sep 2026"},{"id":"ww-ad-hoc-scheduling","k":"ww","t":"Ad Hoc Scheduling","s":"Brian explained that ad hoc trucks had to be manually added to the shared schedule and assigned a track number so they could be attached to the relevant booking.","b":[["ul",["Brian explained that ad hoc trucks had to be manually added to the shared schedule and assigned a track number so they could be attached to the relevant booking. Flight and truck numbers appeared in the listings on the left-hand side, while ad hoc moves used their own number subset and were typically represented as one truck for one day","Brian explained that flight-number ranges already occupied the available 7,000–9,000 series and were recycled, so using a new 97-prefix alone would not reliably identify ad hoc trucks"]]],"src":"d-wallwalk","tags":["scheduling","wall walk"],"conf":"Practice (AI recap)","links":[],"d":"16 Sep 2026"},{"id":"ww-direct-delivery-identification","k":"ww","t":"Direct Delivery Identification","s":"The team discussed confusion around direct deliveries because a movement such as Charlotte to Atlanta could appear to Atlanta as an incoming truck even when the actual delivery…","b":[["ul",["The team discussed confusion around direct deliveries because a movement such as Charlotte to Atlanta could appear to Atlanta as an incoming truck even when the actual delivery was from the customer to DHL. They said a clear customer-to- customer or indirect-drop flag would be preferable, potentially using an airway-bill marker such as the DDX SCC code or a distinguishing letter in the flight or truck identifier","The team discussed using an existing SCC code on the airway bill to identify direct-delivery or ad hoc movements. Brian noted that the booking automation or rebooking bot could potentially add the code, although the bot had recently experienced issues with truck-type handling"]]],"src":"d-wallwalk","tags":["ddx","delivery","direct","identification","scc code","wall walk"],"conf":"Practice (AI recap)","links":[],"d":"16 Sep 2026"},{"id":"ww-direct-delivery-operations","k":"ww","t":"Direct Delivery Operations","s":"Brian said ad hoc direct-pickup and direct-delivery details were currently recorded in the scribble pad with remarks such as “customer pickup” or “customer delivery.” Atlanta or…","b":[["ul",["Brian said ad hoc direct-pickup and direct-delivery details were currently recorded in the scribble pad with remarks such as “customer pickup” or “customer delivery.” Atlanta or London could then identify the correct destination, although the team often still had to send an email for clarification. The team generally pursued this level of investigation only for recurring large-customer traffic, full trucks carrying up to four PMCs, or shipments with significant weight; smaller emergency moves, such as approximately 300-kilogram shipments, were usually not considered worth the additional effort","Brian explained that the team monitored direct pickups and deliveries to confirm that freight actually existed, the customer had made a booking, and no customs hold or cancellation would prevent collection. This helped avoid truck-not-used fees; for example, FedEx in Atlanta canceled four direct pickups on Monday after drivers had already been scheduled, although the customer agreed to pay the resulting fees","Brian explained that direct pickups were handled remotely without a warehouse or agents, while direct deliveries to another party’s warehouse required warehouse personnel to enter the agents’ paperwork and completed work into Cargo","Brian clarified that a shipment arriving in Philadelphia from an international origin, such as London, could require Philadelphia AA to move the freight by truck to SDV in Newark; this was treated as a delivery movement that needed to be monitored for customs status, customer readiness, and cancellation risk"]]],"src":"d-wallwalk","tags":["ddx","delivery","direct","dpu","operations","scribble pad","wall walk"],"conf":"Practice (AI recap)","links":[],"d":"16 Sep 2026"},{"id":"ww-operational-data-classification","k":"ww","t":"Operational Data Classification","s":"The team considered adding another option, such as DDX, to the schedule’s truck-type drop-down alongside FTL and LTL.","b":[["ul",["The team considered adding another option, such as DDX, to the schedule’s truck-type drop-down alongside FTL and LTL. They noted that the truck or service-type classification could affect downstream SAP accounting and iCargo data visibility, and that the relevant field might exist in iCargo without being passed into the current datasets","Brian noted that the information was difficult to find because it was only visible on a screen users would not naturally visit. The team discussed making it visible in screens where users typically work, potentially by adding it to iCargo; an existing checked box might provide a path for that enhancement"]]],"src":"d-wallwalk","tags":["classification","data","operational","wall walk"],"conf":"Practice (AI recap)","links":[],"d":"16 Sep 2026"},{"id":"ww-rfp-awarding","k":"ww","t":"RFP Awarding","s":"For RFP awards, Brian explained that the team evaluated both the bid rate and the vendor’s performance rather than automatically selecting the lowest bid.","b":[["ul",["For RFP awards, Brian explained that the team evaluated both the bid rate and the vendor’s performance rather than automatically selecting the lowest bid. The team considered whether a cheaper truck might be unreliable and cause flight voids if it arrived late, while also accounting for lane-specific performance and isolated incidents. Most scheduled vendors were already known to perform well; one exception served locations where other carriers would not because of its larger network","For newly onboarded vendors, Brian said the team typically assigned a lane or an ad hoc shipment rather than a scheduled truck to evaluate performance. If the vendor performed well, the team began using them more regularly; a failure on the first shipment could prevent further awards"]]],"src":"d-wallwalk","tags":["award","awarding","new vendor","performance","wall walk"],"conf":"Practice (AI recap)","links":[],"d":"16 Sep 2026"},{"id":"ww-performance-tracking","k":"ww","t":"Performance Tracking","s":"Brian described a truck report card used to evaluate vendor performance.","b":[["ul",["Brian described a truck report card used to evaluate vendor performance. The Excel spreadsheet recorded late trucks, affected airway bills, and the reason for each delay, including whether the station caused the delay or whether the team, such as the Dallas operation, kept the truck waiting","Brian said asking vendors to update ratings daily was probably not feasible because ratings would need to be lane-specific and could require a customized solution for AA. The team had previously considered monthly or quarterly updates as more realistic","Brian explained that every truck arriving more than one hour late was manually recorded in a spreadsheet, including the affected airway bills and delay details. Truck lateness could currently be identified only when the station reported it, the trucker reported it, or it appeared in the Tableau report that Praveen had built","Brian said the arrival-time data could serve as a sufficiently accurate proxy for comparative trucker scoring even if it was not perfect, reducing reliance on stations to report truck status manually","Brian identified a blind spot in flight-side monitoring: shipments that were proactively rebooked because capacity was unavailable for up to five days did not appear as failures, even though an airway bill could remain at a location such as Miami for 15 days. The team noted that gateway teams were generally rebooking these shipments, and referenced an Aging Report for tracking prolonged delays","Brian clarified that the truck report included only trucks dispatched with a booking, while trucks that did not show could also appear if they had a booking record. No-show cases were documented in notes and followed up with the trucker","Brian explained that GCX and EPX indicators were used mainly for visibility and triage. EPX failures could be highlighted in red so the team could identify problem areas and renegotiate with the trucker, sometimes obtaining the truck at no cost when the failure involved a chargeable issue. Airway bills were captured manually in the report, which primarily remained organized by truck number","Brian explained that the truck-performance report used red and green coding to highlight issues, including departures more than one hour late. The team focused primarily on arrival performance, but they also contacted the carrier when a truck departed late to confirm its ETA and assess whether the delay would affect the shipment. The report could be filtered by vendor name, truck number, and other attributes","Brian explained that detention or waiting-time charges were investigated before payment. The team used vendor GPS records, CCTV when necessary, and the Tableau report to verify how long a truck had waited, and they sometimes challenged charges when the carrier had also failed on other lanes. Legitimate billed charges were paid, while automation that identified underbooking, cancellations, and truck status earlier could support leaner vendor management and rate negotiations","Brian explained that the truck-tracking spreadsheet had been maintained since the 2019 merger involving US Airways, with each column representing a truck number. The historical pickup-and-delivery data showed meaningful changes in direct and customer pickup activity over time and could serve as evidence for the sales team during business reviews when demonstrating the value of the service","The ad hoc spreadsheet tracked tonnage or utilization, wait times, cancellations, and the station or Sales organization responsible for each charge. Brian indicated that the displayed month-to-date total was nearly $5,000, and explained that FedEx charges passed back to customers on a different airway bill were coordinated by Amy with Accounting at a one-to- one amount so the company did not add a markup"]]],"src":"d-wallwalk","tags":["cctv","detention","gps","late","performance","report card","tracking","wall walk"],"conf":"Practice (AI recap)","links":[],"d":"16 Sep 2026"},{"id":"ww-vendor-risk-management","k":"ww","t":"Vendor Risk Management","s":"Brian explained that when multiple trucks were needed for the same lane, such as four trucks from Philadelphia to Chicago, the team planned to divide the award among multiple…","b":[["ul",["Brian explained that when multiple trucks were needed for the same lane, such as four trucks from Philadelphia to Chicago, the team planned to divide the award among multiple vendors rather than place all trucks with one vendor, reducing the risk that a single vendor failure would disrupt the entire move","Brian said customers were currently charged approximately $200 for last-minute truck cancellations, but that amount was usually not enough to change behavior because it was passed through from the trucking company. The team discussed increasing the fee and using automated reminders to prompt customers to complete required paperwork before the truck departed","The team discussed using the cancellation-fee information to show customers the actual costs created by unused trucks, including fees paid to the trucking company and the team's additional operational work. They said the charge needed to be presented in a way that encouraged customers to change their cancellation behavior rather than treating the fee as a routine pass-through cost","Brian said the team communicated by email with Sales, customers, stations, and truckers when freight was not ready or a truck was delayed, with the goal of avoiding unnecessary fees. The team discussed automating notifications to the relevant station, customer, or trucker when those conditions were detected"]]],"src":"d-wallwalk","tags":["$200","management","risk","split award","vendor","wall walk"],"conf":"Practice (AI recap)","links":[],"d":"16 Sep 2026"},{"id":"ww-truck-visibility","k":"ww","t":"Truck Visibility","s":"The team discussed using airway-bill scan data to improve truck-arrival visibility.","b":[["ul",["The team discussed using airway-bill scan data to improve truck-arrival visibility. Because trucking lacked the flight-style tracking connections that would show a vehicle’s location or expected progress, the proposed comparison was between the scheduled arrival time and the actual acceptance timestamp recorded when the airway bill was scanned at the receiving station. The discussion focused on arrival lateness rather than whether the truck had departed its origin on time","Praveen explained that Tableau identified late truck arrivals by using the arrival scan timestamp stored in shipment historical details and comparing it with the scheduled arrival time. The logic applied across truck segments when the destination station recorded the arrival scan","The team discussed making the Tableau truck-status report live instead of running it once daily. Praveen cautioned that same-day data would contain more null arrival timestamps while trucks were still in transit, typically for six to eight hours depending on departure and travel time, but Brian confirmed that the data would correct itself by the following day"]]],"src":"d-wallwalk","tags":["arrival scan","late","tableau","truck","visibility","wall walk"],"conf":"Practice (AI recap)","links":[],"d":"16 Sep 2026"},{"id":"ww-booking-monitoring","k":"ww","t":"Booking Monitoring","s":"Brian outlined that daily booking monitoring covered void issues, no-show penalties, customs holds, incorrect customer details, changes to customer pickup requests, document…","b":[["ul",["Brian outlined that daily booking monitoring covered void issues, no-show penalties, customs holds, incorrect customer details, changes to customer pickup requests, document collection, information verification, truck dispatch, cargo assignment, truck orders, and emails to truckers. The process applied to both ad hoc and scheduled trucks","Brian said customer pickup and delivery activity was tracked in a spreadsheet divided among approximately two or three team members. The broader Monterey team had about 10 non-management employees, and the spreadsheet included a separate tab for each month where the team recorded whether each movement was a pickup, delivery, or lockout and documented the days on which a truck operated","The monthly management sheet was used as a control checklist rather than as an automation workflow. A blank entry for the current day indicated that the team still needed to work the pickup or delivery; the sheet tracked whether trucks had been dispatched, whether deliveries were completed, and whether the work required to manifest the shipment in Unilo had been finished. Scheduled pickups and deliveries were included, while ad hoc movements remained in a separate sheet","Brian explained that each vendor had its own cancellation window, ranging from six to 24 hours, but the team could still incur the full truck rate when a driver arrived without freight. The team discussed a potential alert for ad hoc trucks departing within 36 hours that had no booking or cargo, along with an automated customer reminder sent the day before departure","Brian described the required order of operations in iCargo: confirm that a booking exists, check for delays, review the airway bill for customs status, and verify that the shipment is ready before dispatching or allowing the truck to proceed. Philadelphia shipments were frequently delayed in customs, and the team often had to inspect the airway bill directly because the station did not always provide an update","The team discussed flagging trucks with no assigned freight shortly before departure, particularly when a truck was due to leave within approximately one hour. A trucker arriving with no freight could create a full-truck charge that the company had to absorb, and this situation occurred at least once a month, usually in Philadelphia","Brian estimated that the unhappy path occurred a couple of times per week. Examples included mismatched dimensions or paperwork, missing paperwork that forced work out of iCargo’s required sequence, and late trucks or other conditions outside the normal workflow"]]],"src":"d-wallwalk","tags":["36 hours","booking","customs","monitoring","no freight","philadelphia","wall walk"],"conf":"Practice (AI recap)","links":[],"d":"16 Sep 2026"},{"id":"ww-truck-booking-controls","k":"ww","t":"Truck Booking Controls","s":"For a scheduled direct pickup or delivery, Richard had to configure a customer-specific block for the relevant PAL each time.","b":[["ul",["For a scheduled direct pickup or delivery, Richard had to configure a customer-specific block for the relevant PAL each time. This guardrail prevented other users from booking the truck and ensured that freight intended for one customer was not routed to another customer’s location"]]],"src":"d-wallwalk","tags":["booking","controls","customer block","pal","richard","truck","wall walk"],"conf":"Practice (AI recap)","links":[],"d":"16 Sep 2026"},{"id":"ww-embargo-automation","k":"ww","t":"Embargo Automation","s":"The team discussed using embargo configuration rather than allotments for customer-specific restrictions when the rule was highly consistent.","b":[["ul",["The team discussed using embargo configuration rather than allotments for customer-specific restrictions when the rule was highly consistent. Brian noted that an embargo could take roughly 30 seconds to create from an email and RPM, while creating an allotment required a file upload and potentially a specific group ID, making the allotment process more cumbersome. Other embargoes were less standardized and might require an API-based approach"]]],"src":"d-wallwalk","tags":["allotment","automation","embargo","wall walk"],"conf":"Practice (AI recap)","links":[],"d":"16 Sep 2026"},{"id":"ww-truck-identification","k":"ww","t":"Truck Identification","s":"Brian explained that the truck order number was a 10-digit unique ID, such as 2609050094, used for billing.","b":[["ul",["Brian explained that the truck order number was a 10-digit unique ID, such as 2609050094, used for billing. It was also referred to as the truck order or TLM number and was assigned when the truck was dispatched and had departed, rather than when the truck was merely created or booked"]]],"src":"d-wallwalk","tags":["10-digit","identification","tlm","truck","truck order","wall walk"],"conf":"Practice (AI recap)","links":[],"d":"16 Sep 2026"},{"id":"ww-uld-inventory-tracking","k":"ww","t":"ULD Inventory Tracking","s":"The LUC indicator showed whether the required message had been sent to Laguna Lo confirming the units associated with the truck.","b":[["ul",["The LUC indicator showed whether the required message had been sent to Laguna Lo confirming the units associated with the truck. LUC supported inventory tracking for empty ULD units, including PMC, PMA, and PLA equipment, and applied the same acceptance and tracking process used when warehouse teams issued units to customers","Brian clarified that LUC tracking coverage was approximately 80% because direct-pickup and delivery locations often lacked the reader needed to scan transponders on the units. The process therefore provided tracking visibility only when the equipment could be read"]]],"src":"d-wallwalk","tags":["inventory","luc","pmc","tracking","uld","unilode","wall walk"],"conf":"Practice (AI recap)","links":[],"d":"16 Sep 2026"},{"id":"ww-shipment-liability","k":"ww","t":"Shipment Liability","s":"The team reviewed the acceptance and delivery liability process.","b":[["ul",["The team reviewed the acceptance and delivery liability process. At the origin warehouse, the team accepted the freight after tender, screened it, and reviewed the paperwork, which marked the start of liability. At delivery, the receiving team checked the pieces and documentation before handing the shipment to the customer, which marked the end of liability","Brian clarified that the team performed the same acceptance checks virtually as warehouse counter and dock agents: they verified the paperwork against the iCargo booking, confirmed the weights and booking details, and checked for dangerous goods or other discrepancies. When paperwork was late, the team had to chase the customer and notify Charlotte so the truck would not be refused on arrival","For freight arriving at Charlotte without complete forms, Brian said hard copies should remain with the freight, typically on its sleeve. Stations were instructed not to refuse the freight when paperwork was missing; once the documents were received, the team proactively scanned them to the station requiring them so the station could not claim that the paperwork was unavailable","The team clarified that the delivery workflow required receiving or dispatching the truck in iCargo, recording the truck’s arrival with a date stamp, and then delivering each airway bill to the end customer. The delivery milestone was tied to NFD, and the team had two hours after the truck arrived to deliver all airway bills; missing that window affected the related performance tracking in iCargo rather than a separate spreadsheet"]]],"src":"d-wallwalk","tags":["acceptance","liability","nfd","paperwork","shipment","wall walk"],"conf":"Practice (AI recap)","links":[],"d":"16 Sep 2026"},{"id":"ww-tsa-compliance","k":"ww","t":"TSA Compliance","s":"Brian explained that every U.S.","b":[["ul",["Brian explained that every U.S. direct pickup required a TSA form confirming that an AA representative had physically seen the freight when accepting it from the truck driver. The requirement followed a prior lesson involving an LOI in Philadelphia. Although the originating team did not always need to retain a copy, the destination station sometimes required it; Brian noted that the team had recently reminded staff after TSA letters were sent approximately 24 hours late","Brian explained that the truck driver’s name was obtained from the truck vendor for pickups and was required at both pickup and delivery for TSA compliance. Driver changes could occur when an assigned driver became unavailable, so the information sometimes had to be updated based on vendor emails","The team discussed that the former standalone TSA website was no longer required after the move to iCargo. The security team and TSA had approved recording the driver information and seal number in iCargo instead, while retaining the data for potential station audits or TSA inquiries"]]],"src":"d-wallwalk","tags":["compliance","driver","seal","tsa","wall walk"],"conf":"Practice (AI recap)","links":[],"d":"16 Sep 2026"},{"id":"ww-cancellation-fees","k":"ww","t":"Cancellation Fees","s":"Brian clarified that cancellation and waiting-time charges were passed through only when the customer was responsible, such as when the customer canceled a shipment or the…","b":[["ul",["Brian clarified that cancellation and waiting-time charges were passed through only when the customer was responsible, such as when the customer canceled a shipment or the freight was not ready. Customs-related issues and other non- customer-caused events were excluded. Each vendor had its own cancellation and waiting-time policy, and the company had been passing the actual truck cost through to the customer without markup, including FedEx charges coordinated with Accounting on a one-to-one basis"]]],"src":"d-wallwalk","tags":["cancel","cancellation","fee","fees","pass-through","tonu","wall walk"],"conf":"Practice (AI recap)","links":[],"d":"16 Sep 2026"},{"id":"ww-station-cost-allocation","k":"ww","t":"Station Cost Allocation","s":"The team confirmed that these costs remained with the trucking team rather than being charged back to individual stations.","b":[["ul",["The team confirmed that these costs remained with the trucking team rather than being charged back to individual stations. Brian said station budgets existed, but Finance had previously determined that assigning the fees to stations was too difficult. The team instead reviewed the data periodically and contacted stations with unusually high paid wait time to understand the cause and encourage corrective action"]]],"src":"d-wallwalk","tags":["allocation","cost","station","station budget","wait time","wall walk"],"conf":"Practice (AI recap)","links":[],"d":"16 Sep 2026"},{"id":"ww-trucking-rates","k":"ww","t":"Trucking Rates","s":"Brian described a plan to build ad hoc fees into the trucking rate rather than manage them separately.","b":[["ul",["Brian described a plan to build ad hoc fees into the trucking rate rather than manage them separately. For example, a Rome lane could combine the baseline line-haul rate, a nine-euro-cent-per-kilogram handling charge for each truck entering Rome, fuel, dangerous-goods charges, and other fees. The rate file organized these amounts by lane and by domestic or international movement, with tiered pricing applied when volume thresholds were reached","Brian explained that station and vendor rates used volume tiers rather than routing freight to reach a target tier. For example, DFW’s rate became cheaper after the operation cleared 1,000,000 pounds, and a projected 3,000,000 pounds in January could be priced with the first million at 15, the second at 13, and subsequent volume at the applicable lower tier. Freight was generally handled on a first-come, first-served basis, with PCX noted as an exception"]]],"src":"d-wallwalk","tags":["handling","rate file","rates","tier","trucking","wall walk"],"conf":"Practice (AI recap)","links":[],"d":"16 Sep 2026"},{"id":"ww-fee-administration","k":"ww","t":"Fee Administration","s":"The team clarified that CDC import fees were normally automated for destinations outside the discussed workflow, but they were manually added for the relevant truck deliveries…","b":[["ul",["The team clarified that CDC import fees were normally automated for destinations outside the discussed workflow, but they were manually added for the relevant truck deliveries because those destinations were not being accepted in iCargo in the usual way. The team had previously discovered missing CDC fees when Accounting questioned the revenue gap, as the process had not been documented clearly for the staff performing the work","The team discussed why the Miami peak surcharge was not being applied automatically to certain airway bills. The surcharge was triggered by the delivery milestone in iCargo, but direct-delivery truck movements that only transferred freight through a station might never reach that milestone. Although the fee remained attached to the airway bill, the missing milestone could prevent it from being applied and could also affect payment advice. The team noted that resolving this would likely require changes to the fee structure and its underlying application logic rather than simply automating delivery processing"]]],"src":"d-wallwalk","tags":["administration","cdc","miami","surcharge","wall walk"],"conf":"Practice (AI recap)","links":[],"d":"16 Sep 2026"},{"id":"ww-operational-scope","k":"ww","t":"Operational Scope","s":"Brian characterized the team’s responsibilities as extending beyond capacity management to include revenue and cost management, shipment tracking, warehouse and operational…","b":[["ul",["Brian characterized the team’s responsibilities as extending beyond capacity management to include revenue and cost management, shipment tracking, warehouse and operational activities, accounting-related work, and training"]]],"src":"d-wallwalk","tags":["operational","scope","wall walk"],"conf":"Practice (AI recap)","links":[],"d":"16 Sep 2026"},{"id":"ww-end-to-end-process","k":"ww","t":"End-to-End Process","s":"Brian outlined the end-to-end airway-bill trucking workflow as several connected processes: deciding whether to accept the movement, determining revenue and cost treatment and…","b":[["ul",["Brian outlined the end-to-end airway-bill trucking workflow as several connected processes: deciding whether to accept the movement, determining revenue and cost treatment and the applicable trucker rate, booking the correct truck and cargo, confirming that the truck arrived on time, and completing the release in iCargo","Brian proposed structuring the trucking-workflow analysis around approximately 25 sequential steps, identifying the owner for each step, mapping the files and data sources used, documenting gaps and issues, recording improvement opportunities, and then consolidating related opportunities into two or three use cases to define the future-state process"]]],"src":"d-wallwalk","tags":["process","wall walk"],"conf":"Practice (AI recap)","links":[],"d":"16 Sep 2026"},{"id":"ww-process-improvement","k":"ww","t":"Process Improvement","s":"Brian said the workshop had generated approximately 50 pages of facilitator notes and a recording, and suggested starting with low-effort improvements before addressing the…","b":[["ul",["Brian said the workshop had generated approximately 50 pages of facilitator notes and a recording, and suggested starting with low-effort improvements before addressing the broader process redesign","Brian said that reducing reactive operational work would allow the team to focus more on proactive activities, including improving recovery processes with the GCS teams, working more closely with vendors, negotiating rates, finding new vendors, and developing a stronger regional procurement strategy","Brian and Praveen characterized the opportunity as a substantial end-to-end effort involving recordings, dashboards, schedule updates, and other workflow components rather than a small project. They discussed defining a long-term North Star and then selecting quick wins that delivered near-term value while fitting the broader solution, with another session needed to review the priority list and remaining process details","The team discussed limiting direct iCargo changes because the next iCargo upgrade was planned for the following year. Until the post-NEO period, human users would continue owning certain inputs, while near-term improvements could focus on information quality, decision support, email management, and updates outside iCargo"]]],"src":"d-wallwalk","tags":["improvement","process","wall walk"],"conf":"Practice (AI recap)","links":[],"d":"16 Sep 2026"},{"id":"ww-staffing-and-procurement","k":"ww","t":"Staffing and Procurement","s":"Brian explained that procurement was currently handled alongside operations, accounting, and other responsibilities.","b":[["ul",["Brian explained that procurement was currently handled alongside operations, accounting, and other responsibilities. The team received approximately 20 vendor emails per week, many from vendors that could not serve airport property, while Rebecca and others were also occupied with operational issues and continuous employee training. Additional staffing in Monterey could support training, vendor development, and procurement, which Brian said could otherwise constitute a full- time role"]]],"src":"d-wallwalk","tags":["procurement","staffing","wall walk"],"conf":"Practice (AI recap)","links":[],"d":"16 Sep 2026"},{"id":"ww-automation-controls","k":"ww","t":"Automation Controls","s":"The discussion established that automation would still require human oversight to prevent harmful outcomes, such as automatically positioning 100 trucks in Atlanta when no…","b":[["ul",["The discussion established that automation would still require human oversight to prevent harmful outcomes, such as automatically positioning 100 trucks in Atlanta when no freight was available. The team needed controls to validate operational conditions before automated decisions were executed","The discussion identified customer pickups and deliveries and TC-related activity as high-priority areas for oversight because missed steps could lead to issues such as airway bills not being properly arrived, NFD problems, or avoidable operational escalations. Participants noted that automation would need to preserve sufficient visibility and human confidence when replacing the current paper-trail-heavy process"]]],"src":"d-wallwalk","tags":["automation","controls","human","oversight","wall walk"],"conf":"Practice (AI recap)","links":[],"d":"16 Sep 2026"},{"id":"ww-reporting-and-records-management","k":"ww","t":"Reporting and Records Management","s":"Brian said the team’s numerous meticulously maintained Excel reports provided valuable quick visibility, but raised the need to determine which records still had to be retained…","b":[["ul",["Brian said the team’s numerous meticulously maintained Excel reports provided valuable quick visibility, but raised the need to determine which records still had to be retained and whether an automated process could preserve an accessible archive in another format","Brian explained that the published schedule maintained by Brian and Rebecca contained schedule changes dating back to approximately 2019, including comments documenting why services were canceled or discontinued. The historical record provided an audit trail and helped answer questions from Sales and other teams about past services"]]],"src":"d-wallwalk","tags":["audit trail","management","records","reporting","retention","wall walk"],"conf":"Practice (AI recap)","links":[],"d":"16 Sep 2026"},{"id":"ww-email-operations","k":"ww","t":"Email Operations","s":"Brian said the team handled nearly 10,000 actionable emails per month and identified email categorization and management as a major automation opportunity.","b":[["ul",["Brian said the team handled nearly 10,000 actionable emails per month and identified email categorization and management as a major automation opportunity. The discussion also connected reclaimed operational time with analyzing truck placement and utilization, such as determining whether trucks should be positioned in locations including Warsaw, Brussels, or Israel and identifying trucks operating at only 30% capacity"]]],"src":"d-wallwalk","tags":["10,000","email","operations","wall walk"],"conf":"Practice (AI recap)","links":[],"d":"16 Sep 2026"},{"id":"ww-wall-walk-request-intake-and-euv-ddx-basics","k":"ww","t":"Wall walk: request intake and EUV/DDX basics","s":"EUV, DDX and how requests reach trucking, from the opening notes of the session.","b":[["ul",["Adhoc schedules are only in Sharepoint","EUV - Exclusive Use Vehicle (Full truck, shuttle)","EVUVI/D - AA only trucks","EUVI/D \"Customer specific\" are pickup and delivery @ customer locations","For EUV (AA to AA), compared against scheduled and interline options.  Validating that an existing solution exists or in event it","doesn't, try and understand what rates have been quoted prev.  No rates?  Send to trucking for quotes.","DDX - Direct Delivery","No rate?  No truck - Trucking team goes to Bid/RFP","Plenty of details need to be filled in by Sales, there IS A FORM.  Needs to be utilized","Opportunity exists to alert stakeholders of request status, who's responsible for the next input?","FTL trucks rarely ordered more than 3 days in advance.  Only driven by large operational backlogs - Project Moves?","Big opportunity for trucking to focus on real-time underbooked frt through monitoring and analysis","Small reefer shipment example:  Looking for upgrade costs for reefer capability","RFPs - Adhoc 80-100 a week"]]],"src":"d-wallwalk","tags":["ddx","euv","form","intake","rfp","wall walk"],"conf":"Practice (AI recap)","links":[],"d":"16 Sep 2026"},{"id":"ww-wall-walk-follow-up-tasks","k":"ww","t":"Wall walk follow-up tasks","s":"Build lane fees into the rate file; share the 38-page light/full station workflow documentation.","b":[["ul",["Build ad hoc handling,     return { it, T, S, G, B, tT: new Set(tok(T)), tS: new Set(tok(S)), tG: new Set(tok(G)), tB: new Set(tok(B)) };
  });
}
function prefixHit(set, w) { if (w.length < 2) return false; for (const t of set) if (t.length > w.length && t.startsWith(w)) return true; return false; }
function termScore(x, w, pref) {
  if (w.includes(" ")) { // phrase synonym
    return (x.T.includes(w) ? 6 : 0) + (x.G.includes(w) ? 4 : 0) + (x.S.includes(w) ? 2.5 : 0) + (x.B.includes(w) ? 1.2 : 0);
  }
  let s = 0;
  if (x.tT.has(w)) s += 8; else if (pref && prefixHit(x.tT, w)) s += 5;
  if (x.tG.has(w)) s += 5; else if (pref && prefixHit(x.tG, w)) s += 2.5;
  if (x.tS.has(w)) s += 2.5; else if (pref && prefixHit(x.tS, w)) s += 1.2;
  if (x.tB.has(w)) s += 1.5; else if (pref && prefixHit(x.tB, w)) s += .6;

}
const KBOOST = { faq: 1.18, screen: 1.15, term: 1.08, check: 1.1, team: 1.12, step: 1.05, doc: 1.0, note: 1.0, q: .8, ww: .95 };
function search(q, limit = 60) {
  const raw = q.trim().toLowerCase();
  if (!raw) return [];
  let terms = tok(raw);
  const kept = terms.filter(t => !STOP.has(t));
  if (kept.length) terms = kept;
  if (!terms.length) return [];
  const groups = terms.map((t, i) => {
    const last = i === terms.length - 1;
    const alts = [{ w: t, k: 1, pref: last || t.length >= 4 }];
    (SYN[t] || []).forEach(s => alts.push({ w: s, k: .65, pref: false }));
    if (t.length > 4 && t.endsWith("s")) alts.push({ w: t.slice(0, -1), k: .9, pref: true });
    return alts;
  });
  const out = [];
  for (const x of INDEX) {
    let score = 0, matched = 0;
    for (const g of groups) {
      let best = 0;
      for (const a of g) best = Math.max(best, termScore(x, a.w, a.pref) * a.k);
      if (best > 0) matched++;
      score += best;
    }
    if (!matched) continue;
    const need = groups.length <= 2 ? groups.length : Math.ceil(groups.length * .6);
    if (matched < need) continue;
    score *= Math.pow(matched / groups.length, 2);
    if (raw.length > 3) { if (x.T.includes(raw)) score += 14; else if (x.S.includes(raw) || x.B.includes(raw)) score += 4; }
    score *= KBOOST[x.it.k] || 1;
    out.push({ it: x.it, score, terms: groups.flat().map(a => a.w) });
  }
  out.sort((a, b) => b.score - a.score);
  return out.slice(0, limit);
}
function hl(text, terms) {
  let h = esc(text);
  const ws = [...new Set(terms.filter(w => w.length > 1))].sort((a, b) => b.length - a.length).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  if (!ws.length) return h;
  return h.replace(new RegExp("\\b(" + ws.join("|") + ")", "gi"), "<mark>$1</mark>");
}
function snippet(it, terms) {
  const pool = [it.s, ...flat(it).split(/(?<=[.!?])\s+| \n /)].filter(Boolean);
  const re = new RegExp("\\b(" + terms.filter(w => w.length > 1).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "i");
  const hit = pool.find(p => re.test(p)) || it.s || pool[0] || "";
  return hl(hit.length > 240 ? hit.slice(0, 238) + "…" : hit, terms);
}

function instantHTML(q) {
  const t = q.trim();
  let m = t.match(/^(?:trk\s*)?(\d{4})(?:\s*\/\s*(\d{1,2}\s*[a-z]{3}))?$/i);
  if (m) {
    const n = +m[1], type = truckType(n);
    if (type) {
      const live = OPS.find(n);
      return `<div class="answer"><span class="eyebrow">Truck number lookup</span>
        <div class="big"><span class="mono">TRK ${n}</span> · ${esc(type)}</div>
        <span class="hint">From the SharePoint truck-number ranges. Numbers are recycled, so treat the type as a hint. <a href="#ref-truck-ranges">See all ranges</a></span>
        ${live ? `<span>On the Ops Hub today: <a href="#truck-${live.key}"><span class="mono">TRK ${live.n}/${live.dl}</span> ${esc(live.o)}→${esc(live.d)} · ${esc(live.vendor)} · ${esc(OPS.statusOf(live).label)}</a> <span class="hint">(demo data)</span></span>` : ""}
      </div>`;
    }
  }
  m = t.match(/^(\d{3})[- ]?(\d{8})$/);
  if (m) {
    const ok = awbCheck(m[2]);
    return `<div class="answer"><span class="eyebrow">AWB check</span>
      <div class="big"><span class="mono">${m[1]}-${m[2]}</span> · check digit ${ok ? "valid" : "does not match"}</div>

  }
  return "";
}

/* ---------- ask the hub */
async function askHub(q, res) {
  const top = res.slice(0, 8).map(r => r.it);
  aiState = { q, text: "", busy: true, err: "", ids: top.map(i => i.id) };
  drawAI();
  const ctx = top.map(it => `[${it.id}] ${it.t}\n${(it.s || "")}\n${flat(it).slice(0, 1400)}`).join("\n\n---\n\n");
  const prompt = `You help an airline cargo trucking coordinator. Answer the question using ONLY the hub articles below.
Rules: 2-5 short sentences or a short list. After each fact, cite the article id in square brackets, like [faq-G3]. If the articles do not answer it, say so in one sentence and name the article that comes closest. Never invent rates, phone numbers or procedures.

Question: ${q}

Articles:
${ctx}`;
  try {
    const r = await CAP.sample(prompt, { onText: ({ text }) => { aiState.text = text; drawAI(); } });
    aiState.text = r.text; aiState.busy = false;
  } catch (e) {
    aiState.busy = false;
    aiState.err = e && e.code === "not_granted" ? "Ask isn't allowed for this page." : e && e.code === "rate_limited" ? "Too many questions in a row. Wait a minute and try again." : "Couldn't get an answer right now.";
    if (e && e.code === "not_granted") CAP.sample = null;
  }
  drawAI();
}
function drawAI() {
  const el = $("#ai"); if (!el || !aiState) return;
  const linkify = s => esc(s).replace(/\[([a-z0-9\-]+)\]/gi, (m, id) => byId.has(id) ? `<a class="code" href="#${id}">${id}</a>` : m)
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").split(/\n{2,}/).map(p => `<p>${p.replace(/\n/g, "<br>")}</p>`).join("");

const GENERIC = new Set(["icargo", "screen", "wall walk", "term", "glossary", "report", "training note", "handwritten", "source", "process", "steps", "remember", "faq", "opportunity", "open question", "audit", "control", "evidence", "cargo1", "plan", "hdq", "duty", "my access"]);

  const tags = new Set((it.tags || []).filter(t => !GENERIC.has(t)));
  const tt = new Set(tok(it.t).filter(w => !STOP.has(w) && w.length > 2));
  return items.filter(x => x !== it && x.k !== "doc").map(x => {

const OPS = (() => {
  const TZ = "America/Chicago";

  const hm = m => { m = Math.round(m); const d = Math.floor(m / 1440); m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0") + (d > 0 ? "+" + d : d < 0 ? " −1d" : ""); };
  const ago = m => m < 1 ? "just now" : m < 60 ? Math.round(m) + " min ago" : m < 1440 ? Math.floor(m / 60) + " h " + String(Math.round(m % 60)).padStart(2, "0") + " min ago" : Math.round(m / 1440) + " d ago";
  const dur = m => m < 60 ? Math.round(m) + " min" : m < 1440 ? Math.floor(m / 60) + " h " + Math.round(m % 60) + " m" : Math.round(m / 144) / 10 + " d";

  const DOM = KB.lanes.filter(l => l[0] === "DOM"), INTL = KB.lanes.filter(l => l[0] === "INTL");
  const US = new Set(DOM.flatMap(l => [l[1], l[2]]));
  const MIX = [ // [range from, to, weight, scope]
    [7800, 8869, 64, "mix"], [8870, 8917, 6, "DOM"], [8935, 9039, 6, "mix"], [7030, 7076, 5, "DOM"], [7231, 7250, 3, "DOM"],
    [7300, 7319, 5, "DOM"], [7336, 7340, 3, "INTL"], [7531, 7550, 3, "INTL"], [7025, 7029, 2, "DOM"], [7201, 7230, 3, "DOM"]];
  const WT = MIX.reduce((s, x) => s + x[2], 0);
  const cache = {};
  function awb(r) { const s = 1000000 + Math.floor(r() * 8999999); return "001-" + String(s).padStart(7, "0") + (s % 7); }
  function gen(k) {
    const c = ctNow(), key = `${c.y}${c.m}${c.d}:${k}`;
    if (cache[key]) return cache[key];
    const r = rng((c.y * 10000 + c.m * 100 + c.d) * 7 + k * 101 + 13);
    const N = [150, 146, 141][k] || 140, used = new Set(), list = [];
    const dt = new Date(Date.UTC(c.y, c.m - 1, c.d + k));
    const ymd = String(dt.getUTCFullYear()).slice(2) + String(dt.getUTCMonth() + 1).padStart(2, "0") + String(dt.getUTCDate()).padStart(2, "0");
    const nowGen = c.min;
    for (let i = 0; i < N; i++) {
      let x = r() * WT, mix = MIX[0]; for (const m of MIX) { if ((x -= m[2]) <= 0) { mix = m; break; } }
      let n; do { n = mix[0] + Math.floor(r() * (mix[1] - mix[0] + 1)); } while (used.has(n)); used.add(n);
      const type = truckType(n) || "Truck";
      const scope = mix[3] === "mix" ? (r() < .78 ? "DOM" : "INTL") : mix[3];
      const pool = scope === "DOM" ? DOM : INTL;
      const L = pool[Math.floor(r() * pool.length)];
      const adhoc = /ad hoc/i.test(type), cust = /customer|cust-specific/i.test(type), intl = scope === "INTL";
      const pud = cust ? (r() < .5 ? "DDX" : "DPU") : "";
      const ltl = /LTL/.test(type);
      let dep = ltl ? 13 * 60 + Math.floor(r() * 10.5 * 60) : 3 * 60 + Math.floor(r() * 19 * 60);

      const transit = cust ? 70 + r() * 230 : intl ? 160 + r() * 420 : 130 + r() * 560;

      const uldTruck = !ltl || r() < .3;
      const cap = intl ? 4 : 5;
      const noFreight = adhoc && r() < .28;
      const nawb = noFreight ? 0 : 1 + Math.floor(r() * (uldTruck ? 4 : 7));
      const awbs = []; let kg = 0, pcs = 0;
      for (let a = 0; a < nawb; a++) { const w = Math.round(80 + r() * (uldTruck ? 2600 : 1800)); const p = 1 + Math.floor(r() * 24); kg += w; pcs += p; awbs.push({ awb: awb(r), kg: w, pcs: p, sh: r() < .5 ? "GEN" : ["PER", "DG", "VAL", "PIL"][Math.floor(r() * 4)] }); }
      const pos = uldTruck ? Math.min(cap, Math.max(nawb ? 1 : 0, Math.round(kg / 1500))) : 0;
      const customsHold = (intl || ["PHL", "MEX", "MTY"].includes(L[2])) && nawb > 0 && r() < .16;
      const docsMissing = cust && nawb > 0 && r() < .2;
      const tsaNeeded = pud === "DPU" && !intl;
      const tsaSent = tsaNeeded ? r() < .78 : true;
      const scanLag = 15 + r() * 470;
      const nfdLag = 25 + r() * 120;
      const t = {
        key: `${n}-${k}`, n, k, dl: dayLabel(k), type, scope, o: L[1], d: L[2], vendor: L[3], equip: ltl ? "LTL" : intl ? (uldTruck ? "DRYI" : "LTL") : (/refrig/i.test(type) ? "REFD" : uldTruck ? "DRYD" : "LTL"),
        adhoc, cust, pud, intl, dep, transit: Math.round(transit), cancelled, depDelay, arrDelay, awbs, kg, pcs, pos, cap, uld: uldTruck,
        noFreight, customsHold, docsMissing, tsaNeeded, tsaSent, scanLag, nfdLag,
        tlm: ymd + String(31 + i * 3).padStart(4, "0"),
        mails: [],
      };
      list.push(t);
    }
    // email threads linked to trucks
    const subj = [
      t => [`TRK ${t.n}/${t.dl} ${t.o}-${t.d} - ETA update`, t.vendor],
      t => [`TRK ${t.n}/${t.dl} delayed`, t.o + " Ops"],
      t => [`Paperwork needed TRK ${t.n} ${t.o}-${t.d}`, t.vendor],
      t => [`TRK ${t.n} ${t.o}-${t.d} - will operate?`, t.vendor],
      t => [`Adding 1 shipment to TRK ${t.n}`, "Sales"],
      t => [`Docs for AWB ${t.awbs[0] ? t.awbs[0].awb : "001-"} TRK ${t.n}`, "Customer"],
      t => [`DG approval TRK ${t.n} ${t.o}-${t.d} UN3480`, t.o + " Acceptance"],
      t => [`${t.pud || "DDX"} request ${t.o}-${t.d} AWB ${t.awbs[0] ? t.awbs[0].awb : ""}`, "Sales"],
      t => [`No show TRK ${t.n} ${t.o}-${t.d} ${t.dl}`, t.vendor],
      t => [`Detention TRK ${t.n} ${t.dl}`, t.vendor],
    ];
    list.forEach(t => {
      let m = t.depDelay > 60 ? 2 : t.docsMissing || t.customsHold || t.noFreight ? 1 : (r() < .22 ? 1 : 0);
      if (k > 0) m = t.noFreight || t.docsMissing ? 1 : (r() < .12 ? 1 : 0);
      for (let j = 0; j < m; j++) {
        let f = t.depDelay > 60 ? (j ? 1 : 0) : t.docsMissing ? 2 : t.customsHold ? 5 : t.noFreight ? 3 : Math.floor(r() * subj.length);
        if (!t.awbs.length && [5, 7].includes(f)) f = 3;
        const [s, from] = subj[f](t);
        const abs = Math.min(k * 1440 + t.dep - 20 - r() * 700, nowGen - 2 - r() * 300);
        t.mails.push({ s, from, at: abs - k * 1440, owner: r() < .7 ? TEAM[Math.floor(r() * TEAM.length)] : "", state: r() < .55 ? "Open" : r() < .6 ? "Waiting on others" : "Replied", kind: f });
      }

  }

  function statusOf(t, now = ctNow().min) {
    const base = t.k * 1440, D = base + t.dep, AD = D + t.depDelay, A = D + t.transit + t.arrDelay;
    if (t.cancelled) return { label: "Cancelled", cls: "p-mute", stage: -1 };
    if (now < D - 120) return { label: "Scheduled", cls: "p-mute", stage: 0 };
    if (now < D) return { label: "Loading", cls: "p-info", stage: 1 };
    if (now < AD) return { label: `Late departure · ${Math.round(now - D)} min`, cls: now - D > 60 ? "p-bad" : "p-warn", stage: 1, late: now - D > 60 };
    if (now < A) { const late = t.arrDelay > 60; return { label: late ? `In transit · ETA +${dur(t.arrDelay)}` : "In transit", cls: late ? "p-bad" : "p-acc", stage: 2, late }; }
    const late = t.arrDelay > 60;
    if (now < A + t.scanLag && !t.cust) return { label: "Arrived · no scan yet", cls: "p-warn", stage: 3, late, noscan: true };
    if (t.pud === "DDX" && now >= A + t.nfdLag) return { label: t.nfdLag > 120 ? "Delivered · NFD missed" : "Delivered", cls: t.nfdLag > 120 ? "p-warn" : "p-good", stage: 4, late };

      { k: "B", name: "Booking exists", ok: t.awbs.length > 0, state: t.awbs.length ? "g" : (t.adhoc ? "b" : "w"), note: t.awbs.length ? `${t.awbs.length} AWB${t.awbs.length > 1 ? "s" : ""}, ${t.pcs} pcs, ${t.kg.toLocaleString()} kg` : "No freight booked" },

      { k: "C", name: "Customs", state: !(t.intl || ["PHL", "MEX", "MTY"].includes(t.d)) ? "n" : t.customsHold ? (pre ? "b" : "w") : "g", note: t.customsHold ? "AWB on customs hold" : (t.intl || ["PHL", "MEX", "MTY"].includes(t.d)) ? "Cleared" : "Not required" },

  function attention(t, now) {

    if (t.customsHold && st.stage <= 1) reasons.push(["b", "Customs hold before departure"]);
    if (t.docsMissing && st.stage <= 1) reasons.push(["w", "Documents missing"]);
    if (t.tsaNeeded && !t.tsaSent && st.stage <= 1) reasons.push(["w", "TSA form not sent"]);
    if (st.noscan) reasons.push(["w", "Arrived but not scanned"]);
    const openOld = t.mails.filter(m => m.state === "Open" && now - (t.k * 1440 + m.at) > 240).length;
    if (openOld) reasons.push(["w", `${openOld} email${openOld > 1 ? "s" : ""} open over 4 h`]);
    return { lvl: reasons.some(r => r[0] === "b") ? 2 : reasons.length ? 1 : 0, reasons };
  }

  /* inbox simulation */
  const HOURW = [2, 1.5, 1.2, 1.2, 1.6, 2.5, 4.5, 6.5, 8, 8.2, 7.6, 6.8, 6, 6.6, 6.9, 6.4, 5.5, 4.4, 3.2, 2.6, 2.3, 2, 1.8, 1.6];
  const HW = HOURW.reduce((a, b) => a + b, 0);
  const extra = { recv: 0, cleared: 0, events: [] };
  function inbox(now) {
    let cum = 0; for (let h = 0; h < 24; h++) { const f = Math.min(1, Math.max(0, (now - h * 60) / 60)); cum += HOURW[h] * f; }
    const recv = Math.round(500 * cum / HW) + extra.recv;
    const cleared = Math.round(recv * .41) + extra.cleared;
    const closedByAgents = Math.round(recv * .36);
    const carry = 46;
    const open = Math.max(0, carry + recv - cleared - closedByAgents);
    const ages = [Math.round(open * .48), Math.round(open * .29), Math.round(open * .17)]; ages.push(Math.max(0, open - ages[0] - ages[1] - ages[2]));
    const hours = HOURW.map((w, h) => ({ h, v: Math.round(500 * w / HW), fut: h * 60 > now, now: Math.floor(now / 60) === h, part: h === Math.floor(now / 60) ? Math.round(500 * w / HW * ((now % 60) / 60)) : null }));
    const cats = [["Delays & ETAs", .22], ["Bookings & capacity", .19], ["Docs & customs", .15], ["DDX / DPU", .13], ["Rates & bids", .1], ["Billing & detention", .08], ["Traces", .07], ["Schedule changes", .06]]
      .map(([n, p]) => [n, Math.round(open * p)]);
    return { recv, cleared, open, ages, hours, cats };
  }

  /* real late trucks (flight record) from late_trucks.py -> late_trucks_feed.js */
  const LT = (() => {
    const f = window.LATE_TRUCKS_FEED;
    if (!f || f.schema !== "aa.late_trucks.v1") return null;
    const trucks = f.trucks || [];
    const counts = {}; trucks.forEach(t => counts[t.date] = (counts[t.date] || 0) + 1);
    const maxN = Math.max(0, ...Object.values(counts));
    // latest day with a real volume of trucks (the export's last day is often nearly empty)
    const last = Object.keys(counts).sort().reverse().find(d => counts[d] >= maxN * .25) || "";
    const isLate = t => t.dep_status === "Late" || t.arr_status === "Late";
    const day = trucks.filter(t => t.date === last);
    const station = {};
    day.forEach(t => {
      const o = station[t.o] = station[t.o] || { late: 0 }, d = station[t.d] = station[t.d] || { late: 0 };
      if (t.dep_status === "Late") o.late++;
      if (t.arr_status === "Late") d.late++;
    });
    const gen = new Date(f.generated);
    return {
      f, last, day, isLate, station,
      late: day.filter(isLate),
      lateAll: trucks.filter(isLate).sort((a, b) => b.date.localeCompare(a.date) || a.truck - b.truck),
      unlogged: trucks.filter(t => t.late && !t.on_report_card).sort((a, b) => b.date.localeCompare(a.date) || a.truck - b.truck),
      byTruck: n => trucks.filter(t => t.truck === n).sort((a, b) => b.date.localeCompare(a.date)),
      ageMin: isNaN(gen) ? null : Math.max(0, Math.round((Date.now() - gen) / 60000)),
      md: d => d ? `${+d.slice(5, 7)}/${+d.slice(8, 10)}` : "",
    };
  })();
  let ltView = "unlogged", ltRows = [];
  const ltTime = iso => iso ? `${LT.md(iso)} ${iso.slice(11, 16)}` : "–";
  const ltCls = s => s === "Late" ? "late" : s === "On time" ? "ok" : s === "Check date" ? "chk" : "sub2";
  function rcTime(iso, base) {  // Report Card style: 2030 / 1305+1
    if (!iso) return "";
    const d = Math.round((Date.parse(iso.slice(0, 10)) - Date.parse(base)) / 864e5);
    return iso.slice(11, 13) + iso.slice(14, 16) + (d > 0 ? "+" + d : d < 0 ? String(d) : "");
  }
  function rcLine(t) {  // tab-separated Report Card columns A:L, paste into 'Report Card 2026'

        <td>${t.on_report_card ? `<span class="pill p-good">Logged</span>` : `<span class="pill p-warn">Not logged</span>`}</td>

        : `<tr><td colspan="10" style="padding:18px;text-align:center;color:var(--muted)">No late trucks ${q2 ? "match the search" : "in the feed"}.</td></tr>`}</tbody></table></div>

    </section>`;
  }

  /* feeds */
  function feeds(now) {
    const lastEvery = (step, off = 0) => now - (((now - off) % step) + step) % step;
    return [
      ...(LT ? [{ n: "Late trucks feed (late_trucks.py)", c: "each Tableau export", last: LT.ageMin == null ? null : now - LT.ageMin, st: LT.ageMin != null && LT.ageMin < 1560 ? "g" : "w", note: `Real flight-record data through ${LT.f.window.to}, built ${LT.f.generated}. Rerun after each export.` }] : []),
