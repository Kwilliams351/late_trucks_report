  /* state */
  let mounted = false, timer = null, day = 0, filter = "att", q2 = "", openKey = null, el = null, lastStatus = new Map(), events = [], lastTick = 0, nextEmailAt = 0, prevKpi = {};
  function find(n) { for (const k of [0, 1, 2]) { const t = gen(k).find(x => x.n === n); if (t) return t; } return null; }
  function byKey(key) { const [n, k] = key.split("-").map(Number); return gen(k).find(t => t.n === n); }
  function glance() {
    const now = ctNow().min, L = gen(0), L1 = gen(1);
    return {
      running: L.filter(t => !t.cancelled).length,
      late: LT ? LT.late.length : L.filter(t => statusOf(t, now).late).length,
      lateNote: LT ? `Late count is real (flight record, ${LT.md(LT.last)}); the rest is demo data that moves with the clock.` : "",
      nofreight: [...L, ...L1].filter(t => t.noFreight && !t.cancelled && (t.k * 1440 + t.dep) - now <= 2160 && (t.k * 1440 + t.dep) > now).length,
      inbox: inbox(now).open,
    };
  }
  function seedEvents(now) {
    events = [];
    gen(0).forEach(t => {
      if (t.cancelled) return;
      const D = t.dep, AD = D + t.depDelay, A = D + t.transit + t.arrDelay;
      if (AD <= now && AD > now - 180) events.push({ at: AD, tag: "Departed", cls: t.depDelay > 60 ? "bad" : "acc", t, text: `${t.o}→${t.d} departed${t.depDelay > 15 ? ` ${t.depDelay} min late` : ""} · TLM ${t.tlm}` });
      if (A <= now && A > now - 180) events.push({ at: A, tag: "Arrived", cls: t.arrDelay > 60 ? "bad" : "good", t, text: `${t.o}→${t.d} arrived${t.arrDelay > 60 ? ` +${dur(t.arrDelay)}` : ""}` });
      t.mails.forEach(m => { if (m.at <= now && m.at > now - 120) events.push({ at: m.at, tag: "Email", cls: "info", t, text: `“${m.s}” from ${m.from}` }); });

    t => ({ tag: "Email", cls: "info", text: `New email “TRK ${t.n}/${t.dl} ${t.o}-${t.d} - ETA update” from ${t.vendor}`, mail: true }),
    t => ({ tag: "Parsed", cls: "acc", text: `ETA reply from ${t.vendor} read: TRK ${t.n} arriving ${hm(t.dep + t.transit + t.arrDelay)}`, mail: false }),

  function tick() {
    if (!mounted) return;

      let changed = false;
      gen(0).forEach(t => {

  function draw(soft) {
    if (!mounted || !el) return;
    const c = ctNow(), now = c.min;
    const L = gen(day), L0 = gen(0), L1 = gen(1);
    const ib = inbox(now);
    const live = L0.filter(t => !t.cancelled);
    const departed = live.filter(t => statusOf(t, now).stage >= 2).length;
    const transit = live.filter(t => statusOf(t, now).stage === 2).length;
    const late = live.filter(t => statusOf(t, now).late).length;
    const nof = [...L0, ...L1].filter(t => t.noFreight && !t.cancelled && (t.k * 1440 + t.dep) - now <= 2160 && (t.k * 1440 + t.dep) > now);
    const holds = live.filter(t => t.customsHold && statusOf(t, now).stage <= 1).length;

      .filter(x => filter === "all" ? true : filter === "att" ? x.at.lvl > 0 : filter === "pud" ? !!x.t.pud : filter === "adhoc" ? x.t.adhoc : filter === "intl" ? x.t.intl : true)
      .filter(x => !q2 || `${x.t.n} ${x.t.o} ${x.t.d} ${x.t.vendor} ${x.t.type} ${x.t.awbs.map(a => a.awb).join(" ")}`.toLowerCase().includes(q2.toLowerCase()))

    const att = L.filter(t => attention(t, now).lvl > 0).length;

    el.innerHTML = `
      <div class="ops-head">

        ${kpiTile("tr", "In transit now", transit, `${live.filter(t => statusOf(t, now).noscan).length} arrived, awaiting scan`)}
        ${LT ? kpiTile("late", "Late > 1 h", LT.late.length, `flight record ${LT.md(LT.last)} · ${LT.late.filter(t => !t.on_report_card).length} not on report card`, LT.late.length ? "bad" : "")
             : kpiTile("late", "Late > 1 h", late, "goes on the report card", late ? "bad" : "")}

              <td>${dots(t, now)}</td>
              <td><div class="load"><span class="bar"><span style="width:${Math.round(pct * 100)}%"></span></span><span class="sub2 mono">${t.awbs.length ? ld : "empty"}</span></div></td>
              <td><span class="mailn ${open ? "" : "z"}">${open || "–"}</span></td></tr>`;
          }).join("") : `<tr><td colspan="9" style="padding:22px;text-align:center;color:var(--muted)">Nothing ${filter === "att" ? "needs attention" : "matches"} for ${dayLabel(day)}. ${filter === "att" ? "Switch to All to see every truck." : ""}</td></tr>`}</tbody></table></div>
          <div class="hint" style="padding:10px 16px">Checks run in the wall-walk order: <b>B</b>ooking exists → <b>D</b>elays → <b>C</b>ustoms → <b>R</b>eady. Click a truck for its card.</div>
        </section>
        <div class="side">
          <section class="panel"><div class="panel-h"><h2>Live feed</h2><span class="hint">last 3 h</span></div>
            <ul class="feed">${events.length ? events.map(e => `<li class="${e.fresh ? "fresh" : ""}"><time>${hm(e.at)}</time><span><span class="tag" style="color:var(--${e.cls === "acc" ? "accent" : e.cls})">${e.tag}</span>${e.t && !e.bot ? `<a href="#truck-${e.t.key}" class="mono">TRK ${e.t.n}</a> ` : ""}${esc(e.text)}</span></li>`).join("") : `<li><time></time><span class="hint">Quiet so far today.</span></li>`}</ul></section>
          <section class="panel"><div class="panel-h"><h2>Data feeds</h2><span class="hint">${LT ? "1 real · rest simulated" : "simulated"}</span></div>
            <ul class="feeds">${feeds(now).map(f => `<li><span class="d ${f.st === "w" ? "w" : f.st === "p" ? "p" : ""}"></span><span>${esc(f.n)} <span class="sub2">· ${esc(f.c)}</span></span><span class="ago" ${f.last != null ? `data-ago="${f.last}"` : ""}>${f.last != null ? ago(now - f.last) : "—"}</span><span class="note">${esc(f.note)}</span></li>`).join("")}</ul></section>
        </div>
      </div>
      ${ltPanel()}
      <div class="lower">
        <section class="panel"><div class="panel-h"><h2>Station pulse</h2><span class="hint">today, busiest first</span></div>
          <div class="stations">${topSt.map(s => `<button class="nf" type="button" data-st="${s.s}"><h5>${s.s}<small>Station facts</small></h5><dl>
            <dt>Trucks out</dt><dd>${s.out}</dd><dt>Trucks in</dt><dd>${s.in}</dd><dt>Late &gt; 1 h</dt><dd class="${s.late ? "bad" : ""}">${s.late}</dd>${LT ? `<dt title="Real: flight record ${LT.md(LT.last)}">Late (flight rec.)</dt><dd class="${(LT.station[s.s] || {}).late ? "bad" : ""}">${(LT.station[s.s] || {}).late || 0}</dd>` : ""}
            <dt>Open emails</dt><dd class="${s.mail > 3 ? "warn" : ""}">${s.mail}</dd><dt>Oldest open</dt><dd>${s.mail ? dur(s.oldest) : "–"}</dd></dl></button>`).join("")}</div></section>
        <section class="panel"><div class="panel-h"><h2>Inbox pulse</h2><span class="hint">Trucking Pulse · AA.Trucking</span></div>
          <div class="inbox">
            <div><div class="hourbars" aria-label="Emails received by hour today">${ib.hours.map(h => `<span class="${h.fut && !h.now ? "fut" : ""} ${h.now ? "now" : ""}" style="height:${Math.max(2, (h.part != null ? h.part : h.v) / 45 * 100)}%" title="${String(h.h).padStart(2, "0")}:00 · ${h.part != null ? h.part : h.v} emails${h.fut && !h.now ? " expected" : ""}"></span>`).join("")}</div>
              <div class="hours"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div></div>
            <div class="ages"><div><b>${ib.ages[0]}</b><span>under 4 h</span></div><div><b>${ib.ages[1]}</b><span>4–24 h</span></div><div class="warn"><b>${ib.ages[2]}</b><span>1–3 days</span></div><div class="${ib.ages[3] ? "bad" : ""}"><b>${ib.ages[3]}</b><span>over 3 days</span></div></div>
            <div class="cats"><div class="h">Open by topic</div><div class="h n">Open</div><div class="h n">Share</div>
              ${ib.cats.map(([n, v]) => `<div>${n}</div><div class="n">${v}</div><div class="n">${ib.open ? Math.round(v / ib.open * 100) : 0}%</div>`).join("")}</div>
          </div></section>
      </div>
      <p class="foot-note">Built on the Integration Blueprint: <a href="#plan-three-rings-of-integration">Ring 1 guides, Ring 2 reads iCargo exports, Ring 3 acts with governed agents</a>. Every screen named on a truck card links to its entry in the hub.</p>`;
    if (soft) { const bw = $(".bwrap"); if (bw) bw.scrollTop = scrollTop; const fd = $(".feed"); if (fd) fd.scrollTop = feedTop; }
    events.forEach(e => e.fresh = false);
    el.querySelectorAll("[data-day]").forEach(b => b.onclick = () => { day = +b.dataset.day; draw(); });
    el.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { filter = b.dataset.f; draw(); });
    const oq = $("#ops-q"); if (oq) { oq.oninput = () => { q2 = oq.value; const pos = oq.selectionStart; draw(true); const n = $("#ops-q"); n.focus(); n.setSelectionRange(pos, pos); }; }
    el.querySelectorAll("tr[data-key]").forEach(tr => { tr.onclick = () => openTruck(tr.dataset.key); tr.onkeydown = e => { if (e.key === "Enter") openTruck(tr.dataset.key); }; });
    el.querySelectorAll("[data-st]").forEach(b => b.onclick = () => { q2 = b.dataset.st; filter = "all"; draw(); $(".board").scrollIntoView({ behavior: "smooth", block: "start" }); });
    el.querySelectorAll("[data-ltv]").forEach(b => b.onclick = () => { ltView = b.dataset.ltv; draw(true); });
    el.querySelectorAll("[data-rc]").forEach(b => b.onclick = () => { const t = ltRows[+b.dataset.rc]; if (t) copy(rcLine(t)); });
    requestAnimationFrame(() => requestAnimationFrame(() => el && el.querySelectorAll(".flash.on").forEach(f => f.classList.remove("on"))));
  }

  /* truck card */
  function routerFor(t, st) {
    const r = [];
    const S = c => `<a class="code" href="#scr-${c.toLowerCase()}">${c}</a>`;
    r.push(`${S("FLT002")} List Operational Flights: confirm status and times for <span class="mono">${t.n}/${t.dl}</span>; use Flight History if the schedule changed.`);
    if (!t.awbs.length) r.push(`${S("RPT002")} Trucking Dashboard: confirm the truck is under-booked, then ask Sales to confirm or cancel inside the vendor's 6–24 h window.`);
    if (t.cust) r.push(`${S("CAP009")} / <a class="code" href="#scr-gca">Global Customer Allotment</a>: check the customer block before changing the truck.`);
    if (t.customsHold) r.push(`${t.intl ? `<a class="code" href="#report-rpt002-report-ics2-pending-clearance">ICS2 Pending Clearance</a>` : "AWB customs status"}: release before dispatch; tell the station.`);
    if (t.docsMissing) r.push(`Compare the customer documents with the iCargo booking before you dispatch (DDX step 7).`);
    if (st.stage >= 2) r.push(`${S("TRK001")} Truck Order: TLM <span class="mono">${t.tlm}</span>; check pieces against the manifest.`);
    if (st.late) r.push(`${S("RPT002")} Truck Departure Delay Report, then send the “TRK ${t.n}/${t.dl} delayed” email and log it on the report card.`);
    if (t.pud === "DDX") r.push(`${S("OPR036")} Delivery: deliver every AWB within 2 h of arrival (NFD); add the CDC fee where it applies.`);
    if (t.pud) r.push(`Scribble pad: “customer ${t.pud === "DDX" ? "delivery" : "pickup"}” on each AWB so the destination knows.`);
    if (t.tsaNeeded) r.push(`TSA form for this US direct pickup${t.tsaSent ? " (sent)" : " — not sent yet"}; driver name from ${esc(t.vendor)}.`);
    return r;
  }
  function articlesFor(t, st) {
    const qs = [];
    if (st.late || t.depDelay > 15) qs.push("A truck is running late");
    if (!t.awbs.length) qs.push("A truck has no freight. Do we cancel it?", "TONU");
    if (t.pud === "DDX") qs.push("What must a DDX prealert say?", "How fast must AWBs be delivered after a truck arrives");
    if (t.pud === "DPU") qs.push("Is a TSA form required for direct pickups?");
    if (t.customsHold) qs.push("How are customs holds on trucked AWBs tracked?");
    if (t.docsMissing) qs.push("Should a station refuse a truck when paperwork is missing?");
    if (t.awbs.some(a => a.sh === "DG")) qs.push("Can a DG (dangerous goods) shipment move on a truck?");
    if (t.mails.some(m => /Detention/.test(m.s))) qs.push("Do we pay wait time or detention?");
    qs.push("Arrival order of operations");
    const out = []; qs.forEach(q => { const r = search(q, 1)[0]; if (r && !out.includes(r.it)) out.push(r.it); });
    return out.slice(0, 5);
  }
  function openTruck(key) {
    openKey = key;
    const layer = $("#layer");
    layer.innerHTML = `<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Truck card"></aside>`;
    layer.querySelector(".scrim").onclick = closeTruck;
    drawTruck(key);
  }
  function closeTruck() { openKey = null; $("#layer").innerHTML = ""; if (location.hash.startsWith("#truck-")) history.replaceState(null, "", "#ops"); }
  document.addEventListener("keydown", e => { if (e.key === "Escape" && openKey) closeTruck(); });
  function drawTruck(key) {
    const t = byKey(key), dr = $(".drawer"); if (!t || !dr) return;
    const now = ctNow().min, st = statusOf(t, now), at = attention(t, now), ck = checks(t, now);
    const base = t.k * 1440, D = base + t.dep, AD = D + t.depDelay, A = D + t.transit + t.arrDelay;
    const tl = [
      ["Booked", t.awbs.length ? `${t.awbs.length} AWBs on the truck` : "No bookings yet", D - 1440, t.awbs.length > 0],
      ["Dispatched", `TLM ${t.tlm} created, vendor emailed`, D - 45, now >= D - 45 && !t.cancelled],
      ["Departed", t.depDelay > 15 ? `Scheduled ${hm(t.dep)}, left ${t.depDelay} min late` : `Scheduled ${hm(t.dep)}`, AD, now >= AD && !t.cancelled],
      ["Arrived", `${t.d}${t.arrDelay > 60 ? ` · +${dur(t.arrDelay)} late` : ""}`, A, now >= A && !t.cancelled],
    ];
    if (t.pud === "DDX") tl.push(["Delivered to customer", `NFD window 2 h${t.nfdLag > 120 ? " · missed" : ""}`, A + t.nfdLag, now >= A + t.nfdLag && !t.cancelled]);
    const rel = articlesFor(t, st);
    const tag = `TRK ${t.n}/${t.dl}`;
    dr.innerHTML = `
      <div class="dr-h"><div style="display:flex;flex-direction:column;gap:6px;min-width:0">
        <span class="eyebrow">Truck card · ${esc(t.type)}</span>
        <h2>${t.n}<span style="color:var(--faint);font-weight:400">/${t.dl}</span> <span style="font-size:18px">${t.o}→${t.d}</span></h2>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="pill ${st.cls}">${esc(st.label)}</span><span class="hint">${esc(t.vendor)} · ${t.equip}${t.pud ? " · " + t.pud : ""}${t.adhoc ? " · ad hoc" : ""}</span></div>
      </div><button class="x" type="button" data-x aria-label="Close">×</button></div>
      <div class="dr-b">
        ${at.reasons.length ? `<div class="callout" style="${at.lvl === 2 ? "background:var(--bad-soft);border-color:var(--bad)" : "background:var(--warn-soft);border-color:var(--warn)"}"><b>Needs attention:</b> ${at.reasons.map(r => esc(r[1])).join(" · ")}</div>` : ""}
        <div class="card"><h4>Checks, in order</h4>
          <ul class="linklist">${ck.map(c => `<li style="display:flex;gap:10px;align-items:center"><span class="dots"><i class="${c.state === "g" ? "" : c.state}">${c.k}</i></span><span><b style="font-weight:600">${esc(c.name)}</b> <span class="hint">${esc(c.note)}</span></span></li>`).join("")}</ul></div>
        <div class="card"><h4>Timeline (CT)</h4><ul class="timeline">${tl.map(([n, s, m, done], i) => {
          const isNow = !done && (i === 0 || tl[i - 1][3]);
          return `<li class="${done ? "done" : ""} ${isNow ? "now" : ""} ${done && /late/.test(s) ? "late" : ""}"><span class="m"></span><time>${hm(m - base)}</time><span><b style="font-weight:600">${n}</b><br><span class="hint">${esc(s)}</span></span></li>`; }).join("")}</ul></div>
        <div class="card"><h4>Where to look in iCargo</h4><ol class="router">${routerFor(t, st).map(x => `<li><span>${x}</span></li>`).join("")}</ol></div>
        ${LT && LT.byTruck(t.n).length ? `<div class="card"><h4>Flight record · truck ${t.n} (real)</h4><div class="tbl"><table><thead><tr><th>Date</th><th>Lane</th><th>Dep</th><th>Arr</th><th>Report card</th></tr></thead><tbody>${LT.byTruck(t.n).slice(0, 8).map(r => `<tr><td class="mono">${LT.md(r.date)}</td><td class="mono">${esc(r.o)}→${esc(r.d)}</td>
          <td style="color:var(--${r.dep_status === "Late" ? "bad" : r.dep_status === "On time" ? "good" : "muted"})">${esc(r.dep_status)}${r.dep_status === "Late" && r.dep_delay != null ? " +" + dur(r.dep_delay) : ""}</td>
          <td style="color:var(--${r.arr_status === "Late" ? "bad" : r.arr_status === "On time" ? "good" : "muted"})">${esc(r.arr_status)}${r.arr_status === "Late" && r.arr_delay != null ? " +" + dur(r.arr_delay) : ""}</td>
          <td>${r.on_report_card ? "Logged" : r.late ? "<b>Not logged</b>" : "–"}</td></tr>`).join("")}</tbody></table></div>
          <span class="hint">From late_trucks.py, built ${esc(LT.f.generated)}.</span></div>` : ""}
        <div class="card"><h4>Emails on this truck · Pulse</h4>${t.mails.length ? `<ul class="mails">${t.mails.slice().sort((a, b) => b.at - a.at).map(m => `<li><span>${esc(m.s)}<div class="who">${esc(m.from)} · <span data-ago="${base + m.at}">${ago(now - (base + m.at))}</span>${m.owner ? " · claimed by " + m.owner : " · unclaimed"}</div></span><span class="pill ${m.state === "Open" ? "p-warn" : m.state === "Replied" ? "p-good" : "p-info"}">${m.state}</span></li>`).join("")}</ul>` : `<p class="hint" style="margin:0">No emails mention this truck.</p>`}</div>
        ${t.awbs.length ? `<div class="card"><h4>Bookings</h4><div class="tbl"><table><thead><tr><th>AWB</th><th>Pcs</th><th>Kg</th><th>SHC</th></tr></thead><tbody>${t.awbs.map(a => `<tr><td class="mono">${a.awb}</td><td class="num">${a.pcs}</td><td class="num">${a.kg.toLocaleString()}</td><td>${a.sh}</td></tr>`).join("")}</tbody></table></div>
          <span class="hint">${t.uld ? `${t.pos} of ${t.cap} positions (${t.intl ? "international trailer: 4" : "US trailer: 5"})` : "LTL, billed on weight"}</span></div>` : ""}
        <div class="card"><h4>From the hub</h4><ul class="linklist">${rel.map(r => `<li><a href="#${esc(r.id)}">${esc(r.t)}<span class="sub">${esc(KIND[r.k][0])}</span></a></li>`).join("")}</ul></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="button" data-copy="${tag}">Copy ${tag}</button>${t.awbs[0] ? `<button class="btn" type="button" data-copy="${t.awbs[0].awb}">Copy first AWB</button>` : ""}</div>
        <p class="hint" style="margin:0">Demo truck generated from real lane ${t.o}-${t.d} (${esc(t.vendor)}) and truck range for “${esc(t.type)}”.</p>
      </div>`;
    dr.querySelector("[data-x]").onclick = closeTruck;
    dr.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copy(b.dataset.copy));
    dr.querySelectorAll("a[href^='#']").forEach(a => a.addEventListener("click", () => { openKey = null; $("#layer").innerHTML = ""; }));
  }

  function mount(container, truckKey) {
    el = container;
    if (!mounted) { mounted = true; const now = ctNow().min; seedEvents(now); nextEmailAt = now + .1; lastTick = now; prevKpi = {}; }
    draw();
    clearInterval(timer); timer = setInterval(tick, 1000);
    if (truckKey) { const t = byKey(truckKey); if (t) { if (t.k !== day) { day = t.k; draw(); } openTruck(truckKey); } }
  }
  function stop() { if (mounted) { mounted = false; clearInterval(timer); if (openKey) { openKey = null; $("#layer").innerHTML = ""; } } }
  return { mount, stop, find, statusOf, glance, ctNow };
})();

/* header clock */
function clock() { const c = OPS.ctNow(); $("#clock").textContent = `${c.hh}:${c.mm}`; }
clock(); setInterval(clock, 5000);

buildIndex();
render();
</script>

</body></html>
